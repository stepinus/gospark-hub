description: "trohrbaugh's Heretic ARA uncensored Qwen3.8-27B as an EXL3 2.00 bpw pack (6-bit head, vision tower unquantized) served by TensorFold v0.6.0 with z-lab's DFlash2 drafter: the small uncensored build, to run beside image and video models and still see their results: 67.7 tok/s writing, 193.6 code-edit in ~15 GB. Images work as OpenAI image_url parts (data URLs). Launch it before the image or video model to get the full native 262K context: TensorFold sizes its window to the memory free at start, so beside an already-running Qwen-Image-2.1 it starts at 131K. A 103K-token prompt peaked at 26 GB beside Qwen-Image. The drafter was trained on the stock model; every drafted token is verified by the target, so output is the uncensored model's own. Community quant (bombdefuser-124) made with exllamav3's official convert.py. Thinking on by default, tool calling and reasoning live. Removes safety refusals the upstream model was trained to have; supply your own guardrails. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
