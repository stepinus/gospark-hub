name: "SpatialEdit"
slug: spatialedit
version: "1.0.0"
description: "Fine-grained spatial image editing with SpatialEdit-16B — rotate objects, move them, or change camera viewpoint on a single image. Built on Qwen3-VL-8B + Wan2.1 VAE + a 16B flow-matching DiT."
author: "EasonXiao-888"
source: "spark-ai-hub"
website: "https://github.com/EasonXiao-888/SpatialEdit"
upstream: "https://github.com/WaxacaBytes/spatialedit-spark-ai-hub"
fork: "https://github.com/EasonXiao-888/SpatialEdit"
category: image-gen
tags:
  - image-edit
  - spatial
  - diffusion
  - camera-control
  - rotation
icon: "🧭"
logo: "/logos/spatialedit.png"
requirements:
  min_memory_gb: 48
  recommended_memory_gb: 96
  disk_gb: 80
  cuda_compute: "12.1"
ui:
  type: web
  # Port inside the container. Nothing is published to the host:
  # the app is served at /run/spatialedit/ on the Hub's own port.
  port: 7860
  proxy: true
  path: "/"
docker:
  build: false
  build_time_minutes: 45
  gpu: true
status: community-verified
release_date: "2026-03"

cover:
  image: real-spatialedit.jpg
  backdrop:
    image: hero-spatialedit.jpg
  caption: "One car rotated through eight viewpoints, from SpatialEdit's task figure."
  grade: false
  credit: "SpatialEdit task figure, EasonXiao-888"
  source: "https://github.com/EasonXiao-888/SpatialEdit/blob/main/assets/task_definition.png"
