services:
  spatialedit:
    image: ghcr.io/waxacabytes/spatialedit-spark-ai-hub:latest
    container_name: spark-ai-hub-spatialedit
    # No published port: the front-door proxy reaches this container
    # by name on the shared network, so nothing can collide and the
    # whole Hub stays behind one port.
    networks:
      - spark-ai-hub-net
    environment:
      GRADIO_ROOT_PATH: "/run/spatialedit"
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
      HF_HOME: "/root/.cache/huggingface"
      OUTPUT_DIR: "/data/output"
    volumes:
      - spatialedit-hf-cache:/root/.cache/huggingface
      - spatialedit-output:/data/output
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  spatialedit-hf-cache:
  spatialedit-output:

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
