services:
  tensorfold:
    # llmfan46's uncensored (Heretic) Qwen3.6-35B-A3B served by TensorFold's
    # qwen3_5_moe CUDA engine, from froggeric's MLX 4-bit conversion: the same
    # format as TensorFold's own checkpoint (affine, groups of 64, routers and
    # the shared-expert gate at 8 bits) and the same 2,090 tensors, so it runs
    # the stock recipe's kernels on the same bytes. Heretic's published
    # numbers: refusals 83/100 -> 10/100 at a KL divergence of 0.0015.
    # Every serving flag is the stock tensorfold-qwen36-35b-a3b-int4-mtp
    # recipe's, which follows upstream's recipe:
    #   https://github.com/ashhart/TensorFold/blob/v0.6.1/docs/recipes/qwen3.6-moe.md
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        # --- weights stage ---------------------------------------------------
        # Model weights are part of the app artifact: baked into the final
        # image below, so `docker rmi` reclaims every byte this recipe added.
        # 14 files, 19.5 GiB, both repos pinned to the revisions measured.
        FROM python:3.12-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('froggeric/Qwen3.6-35B-A3B-Uncensored-Heretic-MLX-4bit', revision='32939a6cef2750f18ccf352443f22f2e4dfe3613', local_dir='/weights', ignore_patterns=['.gitattributes', 'README.md', 'chat_template.README.md'], max_workers=8)"
        # Three files from TensorFold's stock checkpoint, laid over it:
        # - mtp-4bit.safetensors: the MTP layer, which this conversion drops
        #   and the CUDA engine needs to draft. It is the stock model's head;
        #   every drafted token is verified by the uncensored weights, so the
        #   output is theirs. TensorFold's recipe serves a plain mlx-lm folder
        #   the same way once this file is placed in it.
        # - chat_template.jinja + tokenizer_config.json: Qwen's own template,
        #   in place of froggeric's rewrite (developer role, a think on/off
        #   tag), so prompts render exactly as in the stock recipe. Vocab,
        #   merges and special tokens are identical in both repos.
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('TensorFold/Qwen3.6-35B-A3B-MLX-4bit-MTP', revision='f84b054c5677b6e59bdb969ae61915b0983d68bb', local_dir='/weights', allow_patterns=['mtp-4bit.safetensors', 'chat_template.jinja', 'tokenizer_config.json'])"

        # --- runtime stage ---------------------------------------------------
        # TensorFold publishes no image. This is the one the Flash-Next recipe
        # runs, pinned by the same digest (tag v0.6.1-797af1d9df4d) so the two
        # share every layer: NVIDIA's nvcr.io/nvidia/pytorch:26.07-py3 (arm64,
        # CUDA 13), i.e. upstream's CUDA container, with TensorFold v0.6.1 and
        # Mia's AI Lab's one patch, written for Flash-Next:
        # 0002-flash-next-v061: video input and up to 50 images on TensorFold's
        # own Flash Next vision, copy drafts, the prompt-chunk rows override,
        # SSD read-ahead around the n-gram table, first token before the next
        # draft. Live /health totals, draft stats, tiled QSA selection and image
        # input are TensorFold's own since v0.5.0 / v0.6.0.
        FROM ghcr.io/miaai-lab/qwen3.8-flash-next-single-dgx-spark-tensorfold@sha256:667693ccd7eea95d365ee5a17eed97067e13deb131a6e61fbbbbe6f69d0ebc69
        # TensorFold compiles its CUDA extensions on first use into
        # TORCH_EXTENSIONS_DIR (upstream: a host cache mounted at /cache).
        # Compiled here instead, for GB10 (sm_121) only, so they ship inside
        # the image and launch compiles nothing. No GPU is needed to compile:
        # the capability TensorFold asks the driver for is stated instead.
        ENV TORCH_EXTENSIONS_DIR=/opt/tensorfold/torch_extensions \
            TRITON_CACHE_DIR=/tmp/triton \
            TORCH_CUDA_ARCH_LIST=12.1
        RUN <<'PY' python3
        import importlib, pkgutil, torch, tensorfold
        torch.cuda.get_device_capability = lambda *a: (12, 1)
        for m in pkgutil.walk_packages(tensorfold.__path__, "tensorfold."):
            if any(k in m.name for k in ("mlx", "metal", "__main__")):
                continue
            try:
                mod = importlib.import_module(m.name)
            except BaseException:
                continue
            ext = getattr(mod, "_ext", None)
            if callable(ext) and getattr(ext, "__module__", "") == m.name:
                ext()
                print("built", m.name, flush=True)
        PY
        COPY --from=weights /weights /models/Qwen3.6-35B-A3B-Uncensored-Heretic-MLX-4bit
    image: spark-ai-hub/tensorfold-qwen36-35b-a3b-uncensored-int4-mtp:tf-v0.6.1-32939a6
    container_name: spark-ai-hub-tensorfold-qwen36-35b-a3b-uncensored-int4-mtp
    networks:
      - spark-ai-hub-net
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      # Offline-first: the checkpoint is in the image and is served from a
      # directory path, so nothing is resolved against the Hub.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      # No "is there a newer TensorFold" call to GitHub at each start.
      - TENSORFOLD_NO_UPDATE_CHECK=1
      # Upstream's measurement setting: lets the allocator grow segments
      # instead of fragmenting across prompt sizes.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - PYTHONUNBUFFERED=1
    # The image's entrypoint (NVIDIA's banner) runs this command.
    command:
      - tensorfold
      - serve
      - /models/Qwen3.6-35B-A3B-Uncensored-Heretic-MLX-4bit
      - --host
      - "0.0.0.0"
      - --port
      - "8888"
      - --name
      - llmfan46/Qwen3.6-35B-A3B-uncensored-heretic
      # Eight requests decoded in shared rounds; every reply equals the same
      # request served alone, and a lone request replays the one-stream CUDA
      # graphs, so it runs as fast as without --parallel.
      - --parallel
      - "8"
      # No --context: on CUDA TensorFold sizes each stream's window to the
      # memory free at start, up to the native 262,144, and refuses before
      # loading if eight full windows would not fit.
      # FP8 prompt activations: upstream measures bf16 prompts at 0.90-0.96x
      # of this path; decode is unaffected.
      - --prefill-fp8
      # Qwen's thinking-mode sampling (the checkpoint's generation_config);
      # a request's own values win.
      - --temperature
      - "1.0"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --thinking
      # Reply length for a request without max_tokens (TensorFold's own 4,096
      # can end a thinking reply before it answers).
      - --max-tokens
      - "32768"
      # No --vision: TensorFold 0.6.1 refuses it for this family ("--vision
      # supports GLM-5.3-Flash, Flash Next and Qwen3.5/3.8 dense checkpoints"),
      # so this build is text-only although the checkpoint keeps its tower.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # NOT unless-stopped: a boot that fails must stop instead of looping.
    restart: on-failure:1

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
