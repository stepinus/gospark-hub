name: "Qwen3.6-35B-A3B MoE Uncensored INT4 MTP"
slug: tensorfold-qwen36-35b-a3b-uncensored-int4-mtp
version: "1.0.0"
description: "llmfan46's uncensored Qwen3.6-35B-A3B — 35B total parameters, 3B active, Gated DeltaNet and gated full attention with 256 routed experts — made with Heretic, which removes the refusal direction with separate settings for the linear and full attention layers: refusals fell from 83/100 to 10/100 at a KL divergence of 0.0015 from the original (the publisher's measurements). Served by TensorFold with every flag of the stock Qwen3.6-35B-A3B recipe, from froggeric's MLX 4-bit conversion — the same format and tensors as TensorFold's own checkpoint, with Qwen's stock chat template and the stock MTP layer. Decoding drafts up to three MTP tokens a round, plus copied continuations when the reply repeats the context; every draft is verified by the uncensored model, so output is its own. Eight requests decode together, each with up to the native 262K window. Prompts fill in FP8. Tool calling and reasoning work as usual; text only. Removes safety refusals the upstream model was trained to have; supply your own guardrails. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
