name: "Hunyuan3D-2mv"
slug: hy3dgen-hunyuan3d-2mv
version: "1.0.0"
description: "Turn several pictures of one object into a textured 3D model (GLB): Tencent's multi-view Hunyuan3D-2mv builds the shape from a front view plus any of the left, back and right views, so the sides and back come out as they really are instead of being guessed; Hunyuan3D-2's paint and delight models then texture it from the front view. Works best with real photos of one object from several sides on a plain background; the Hub cuts the backgrounds out before sending them. Runs on Tencent's own code in a small Spark AI Hub engine; your coding agents reach it through the Hub's 3D tools (generate_3d with views / get_3d), and the models open in My files to turn around. Tencent Hunyuan Community License (not licensed in the EU, UK or South Korea)."
author: "Tencent Hunyuan"
source: "spark-ai-hub"
website: "https://github.com/Tencent-Hunyuan/Hunyuan3D-2"
upstream: "https://github.com/WaxacaBytes/hunyuan3d-2mv-spark-ai-hub"
fork: "https://huggingface.co/tencent/Hunyuan3D-2mv"
category: 3d-gen
categories:
  - 3d-gen
tags:
  - openai-meshes
  - image-to-3d
  - multi-view
  - hunyuan3d
  - tencent
icon: "\U0001F9CA"
logo: "/logos/hunyuan3d.png"
requirements:
  min_memory_gb: 32
  recommended_memory_gb: 48
  disk_gb: 60
  cuda_compute: "12.1"
ui:
  # No web page of its own: the Hub's MCP 3D tools call its API. Proxied so
  # the Hub reaches it at /run/hy3dgen-hunyuan3d-2mv/ with no host port.
  type: api-only
  port: 30000
  proxy: true
  path: "/v1/models"
  health_path: "/health"
docker:
  build: true
  build_time_minutes: 15
  gpu: true
status: experimental
release_date: "2025-03"
engine: "hy3dgen"
# Tencent's model table: 1.1B shape DiT + 1.3B texture (Paint) model, both run per result.
params_b: 2.4
quantization: "FP16"
weights_gb: 14.4
render_seconds: 117.3
render_workload: "one 1024x1024 picture, default steps, textured GLB (3.8 MB)"
load_seconds: 43
requires_hf_token: false
# Human-preference Elo as each board published it on the date read (see
# RecipeArenaScore). base: true = the board lists only the base model.
arena:
  - board: 3D Arena
    task: image-to-3d
    elo: 1283
    entry: Hunyuan3D-2
    votes: 5245
    read: '2026-10-15'
    url: https://huggingface.co/spaces/3d-arena/3d-arena
    base: true
