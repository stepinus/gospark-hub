name: "Pixal3D"
slug: pixal3d-spark
version: "1.0.0"
description: "Generate high-fidelity 3D assets from a single image with Pixal3D — explicitly projects pixel features into 3D space on top of the TRELLIS.2 backbone for sharper geometry and PBR-ready textures."
author: "TencentARC"
source: "spark-ai-hub"
website: "https://github.com/TencentARC/Pixal3D"
upstream: "https://github.com/WaxacaBytes/pixal3d-spark-ai-hub"
fork: "https://github.com/TencentARC/Pixal3D"
category: 3d-gen
categories:
  - 3d-gen
tags:
  - 3d
  - image-to-3d
  - mesh
  - pbr
  - pixal3d
  - tencent
logo: "/logos/pixal3d.png"
requirements:
  min_memory_gb: 32
  recommended_memory_gb: 80
  disk_gb: 45
  cuda_compute: "12.1"
ui:
  type: web
  # Port inside the container. Nothing is published to the host:
  # the app is served at /run/pixal3d-spark/ on the Hub's own port.
  port: 7860
  proxy: true
  path: "/"
docker:
  build: true
  build_time_minutes: 8
  gpu: true
status: official
release_date: "2026-05"
requires_hf_token: true
# Meta's DINOv3 (manual approval) and BRIA's RMBG-2.0: the token's account
# must accept both on the web.
gated_repos:
  - "facebook/dinov3-vitl16-pretrain-lvd1689m"
  - "briaai/RMBG-2.0"

cover:
  image: real-pixal3d.jpg
  backdrop:
    image: hero-pixal3d.jpg
  caption: "Meshes generated by Pixal3D, from TencentARC's teaser."
  grade: false
  credit: "Pixal3D teaser, TencentARC"
  source: "https://github.com/TencentARC/Pixal3D/blob/master/assets/teaser.png"
