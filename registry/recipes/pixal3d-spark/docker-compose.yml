services:
  pixal3d:
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('TencentARC/Pixal3D'); snapshot_download('Ruicheng/moge-2-vitl'); snapshot_download('briaai/RMBG-2.0'); snapshot_download('facebook/dinov3-vitl16-pretrain-lvd1689m')"
        FROM ghcr.io/waxacabytes/pixal3d-spark-ai-hub:latest
        COPY --from=weights /weights /workspace/cache/huggingface
    image: spark-ai-hub/pixal3d-spark:latest
    container_name: spark-ai-hub-pixal3d
    # No published port: the front-door proxy reaches this container
    # by name on the shared network, so nothing can collide and the
    # whole Hub stays behind one port.
    networks:
      - spark-ai-hub-net
    volumes:
      - pixal3d-output:/workspace/Pixal3D/tmp
    environment:
      GRADIO_ROOT_PATH: "/run/pixal3d-spark"
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
      HF_HOME: "/workspace/cache/huggingface"
      TRITON_CACHE_DIR: "/workspace/cache/triton"
      TORCH_HOME: "/workspace/cache/torch"
      ATTN_BACKEND: "flash-attn"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-1}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  pixal3d-output:

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
