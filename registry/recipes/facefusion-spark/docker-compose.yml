services:
  facefusion:
    image: abelpc/facefusion-spark:latest
    container_name: spark-ai-hub-facefusion
    # No published port: the front-door proxy reaches this container
    # by name on the shared network, so nothing can collide and the
    # whole Hub stays behind one port.
    networks:
      - spark-ai-hub-net
    environment:
      GRADIO_ROOT_PATH: "/run/facefusion-spark"
    volumes:
      - facefusion-models:/app/facefusion/.assets/models
      - facefusion-output:/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  facefusion-models:
  facefusion-output:

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
