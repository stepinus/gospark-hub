description: "Qwen3.8-27B in Qwen's own first-party FP8 checkpoint, served by SGLang with DFlash2, Inco AI's second-generation block-diffusion drafter. It drafts a whole block in one pass and keeps the top candidates at every position; decoding is lossless, so the speculator cannot change what the weights would have said. The middle rung between the BF16 and NVFP4 DFlash2 recipes. Dense 27B hybrid Gated DeltaNet vision-language model, thinking on by default, 262K context, vision and tool calling live."
