services:
  vllm-omni:
    # Wan2.2-VACE-Fun-A14B (alibaba-pai, in Pyros13's diffusers conversion),
    # served by vLLM-Omni on the OpenAI videos API. Two 14B experts (high-noise and
    # low-noise) for all-in-one video creation and editing: text-to-video,
    # image-to-video, reference-to-video, video-to-video editing and inpainting from
    # an uploaded input video. vLLM-Omni's recipe serves it with Wan22VACEPipeline,
    # tiled VAE decode and eager mode.
    #
    # Image: vllm/vllm-omni:v0.28.0 -- the latest stable release (not a nightly
    # or rc), arm64 manifest present, and this model is in its model list.
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Pyros13/Wan2.2-VACE-Fun-A14B-Diffusers', local_dir='/models/Wan2.2-VACE-Fun-A14B-Diffusers', ignore_patterns=['*.jpg', '*.png', '*.gif', '*.webp', '*.mp4', 'assets/*', 'docs/*', 'examples/*'])"
        FROM vllm/vllm-omni:v0.28.0
        COPY --from=weights /models /models
    image: spark-ai-hub/vllmomni-wan22-vace-fun-a14b:v0.28.0
    container_name: spark-ai-hub-vllmomni-wan22-vace-fun-a14b
    # No published port: the Hub reaches this container by name through its
    # front door at /run/vllmomni-wan22-vace-fun-a14b/, so it never collides with the LLM
    # or with another media model.
    networks:
      - spark-ai-hub-net
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    shm_size: 16gb
    entrypoint: ["vllm"]
    command:
      - serve
      - /models/Wan2.2-VACE-Fun-A14B-Diffusers
      - --omni
      - --served-model-name
      - Pyros13/Wan2.2-VACE-Fun-A14B-Diffusers
      # No --model-class-name: the checkpoint's model_index.json names
      # WanVACEPipeline, which v0.28.0's registry maps to its Wan2.2 VACE
      # implementation. (The recipe's "Wan22VACEPipeline" is only the class
      # name, and passing it as the registry key fails at startup.)
      - --vae-use-tiling
      - --enforce-eager
      - --host
      - 0.0.0.0
      - --port
      - "30000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
