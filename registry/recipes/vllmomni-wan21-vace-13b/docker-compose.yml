services:
  vllm-omni:
    # Wan2.1-VACE-1.3B (Wan-AI), served by vLLM-Omni on the OpenAI videos API:
    # POST /v1/videos (multipart) queues a job, GET /v1/videos/{id} reports progress,
    # GET /v1/videos/{id}/content serves the MP4. VACE is Wan's all-in-one video
    # creation and editing model: text-to-video, image-to-video, and video-to-video
    # editing / inpainting from an uploaded input video (input_reference).
    #
    # Image: vllm/vllm-omni:v0.28.0 -- the latest stable release (not a nightly
    # or rc), arm64 manifest present, and this model is in its model list.
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Wan-AI/Wan2.1-VACE-1.3B-diffusers', local_dir='/models/Wan2.1-VACE-1.3B-diffusers', ignore_patterns=['*.jpg', '*.png', '*.gif', '*.webp', '*.mp4', 'assets/*', 'docs/*', 'examples/*'])"
        FROM vllm/vllm-omni:v0.28.0
        COPY --from=weights /models /models
    image: spark-ai-hub/vllmomni-wan21-vace-13b:v0.28.0
    container_name: spark-ai-hub-vllmomni-wan21-vace-13b
    # No published port: the Hub reaches this container by name through its
    # front door at /run/vllmomni-wan21-vace-13b/, so it never collides with the LLM
    # or with another media model.
    networks:
      - spark-ai-hub-net
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    shm_size: 16gb
    entrypoint: ["vllm"]
    command:
      - serve
      - /models/Wan2.1-VACE-1.3B-diffusers
      - --omni
      - --served-model-name
      - Wan-AI/Wan2.1-VACE-1.3B-diffusers
      - --vae-use-tiling
      - --host
      - 0.0.0.0
      - --port
      - "30000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
