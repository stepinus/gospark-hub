name: "Wan2.1-VACE-1.3B"
slug: vllmomni-wan21-vace-13b
version: "1.0.0"
description: "Create and edit short videos with Wan-AI's Wan2.1-VACE-1.3B, the compact all-in-one video model: text-to-video, image-to-video, and editing, extending or inpainting an existing video from an instruction. Served by vLLM-Omni on the OpenAI videos API; your coding agents reach it through the Hub's video tools (generate_video / get_video). Apache 2.0."
author: "Wan-AI (Alibaba)"
source: "community"
website: "https://huggingface.co/Wan-AI/Wan2.1-VACE-1.3B-diffusers"
upstream: "https://github.com/ali-vilab/VACE"
category: video-gen
categories:
  - video-gen
tags:
  - openai-videos
  - text-to-video
  - image-to-video
  - video-edit
  - wan
  - vace
  - vllm-omni
  - bf16
icon: "\U0001F3AC"
logo: "/logos/wan.png"
requirements:
  min_memory_gb: 24
  recommended_memory_gb: 40
  disk_gb: 60
  cuda_compute: "12.1"
ui:
  # No web page of its own: the Hub's MCP tools call its API. Proxied so the
  # Hub reaches it at /run/vllmomni-wan21-vace-13b/ with no host port.
  type: api-only
  port: 30000
  proxy: true
  path: "/v1/models"
  health_path: "/health"
docker:
  build: true
  build_time_minutes: 20
  gpu: true
status: experimental
release_date: "2025-06"
engine: "vLLM-Omni"
params_b: 1.3
arch: dense
quantization: "BF16"
weights_gb: 19.0
render_seconds: 422.4
render_workload: "4.8 s 16:9 clip from a first frame, 832x480, 30 steps"
load_seconds: 136
requires_hf_token: false
# From Wan-AI's diffusers example on this model's card (WanVACEPipeline, the
# same UniPC flow pipeline served here): 30 steps, guidance 5.0, 81 frames at
# 16 fps, flow_shift "5.0 for 720P, 3.0 for 480P" -- 3.0 for this 832x480.
# (Wan's original generate.py CLI uses 50 steps and shift 16 for VACE.)
video_defaults:
  steps: 30
  guidance_scale: 5.0
  fps: 16
  num_frames: 81
  size: "832x480"
  flow_shift: 3.0
  notes: "Wan-AI's diffusers example: 30 steps, guidance 5.0, 81 frames (~5 s at 16 fps), flow shift 3.0 at 480p (5.0 at 720p)."
  source: "https://huggingface.co/Wan-AI/Wan2.1-VACE-1.3B-diffusers"
