name: "Z-Image"
slug: sglang-z-image
version: "1.0.0"
description: "Generate images with Tongyi-MAI's Z-Image, the undistilled 6B base model with full classifier-free guidance for precise prompt following, served by SGLang Diffusion on the OpenAI images API. Your coding agents reach it through the Hub's image tools (generate_image). Apache 2.0."
author: "Tongyi-MAI (Alibaba)"
source: "community"
website: "https://huggingface.co/Tongyi-MAI/Z-Image"
upstream: "https://huggingface.co/Tongyi-MAI/Z-Image"
category: image-gen
categories:
  - image-gen
tags:
  - openai-images
  - text-to-image
  - z-image
  - diffusion
  - sglang
  - bf16
icon: "\U0001F5BC️"
logo: "/logos/tongyi.png"
requirements:
  min_memory_gb: 24
  recommended_memory_gb: 32
  disk_gb: 60
  cuda_compute: "12.1"
ui:
  # No web page of its own: the Hub's MCP image tools call its API. Proxied so
  # the Hub reaches it at /run/sglang-z-image/ with no host port.
  type: api-only
  port: 30000
  proxy: true
  path: "/v1/models"
  health_path: "/health"
docker:
  build: true
  build_time_minutes: 15
  gpu: true
status: experimental
release_date: "2025-12"
engine: "SGLang"
params_b: 6
arch: dense
quantization: "BF16"
weights_gb: 20.5
render_seconds: 45.6
render_workload: "1024x1024, 28 steps"
load_seconds: 71
requires_hf_token: false

# Human-preference Elo as each board published it on the date read (see
# RecipeArenaScore). base: true = the board lists only the base model.
arena:
  - board: AA-Image-T2I v2.1
    task: text-to-image
    elo: 890
    entry: Z-Image Base
    votes: 2168
    read: '2026-10-15'
    url: https://artificialanalysis.ai/image/leaderboard/text-to-image

cover:
  image: scene-z-image.jpg
  caption: "A lone boat on Hangzhou's West Lake at blue hour — Alibaba, whose Tongyi lab made Z-Image, is based in Hangzhou. Generated by Z-Image itself on the Spark."
  grade: false
  credit: "Generated with Z-Image · Apache 2.0"
  source: "https://huggingface.co/Tongyi-MAI/Z-Image"
# From the model card: "Inference steps: 28 – 50" with guidance_scale 4. The
# user's choice is the bottom of that range, 28. The Hub's image tools use these
# whenever an agent leaves them unset.
image_defaults:
  steps: 28
  guidance_scale: 4.0
  notes: "Undistilled base model; the card recommends 28-50 steps with guidance 4. 28 is the minimum it recommends."
  source: "https://huggingface.co/Tongyi-MAI/Z-Image"
