services:
  sglang:
    # Z-Image (Tongyi-MAI) served by SGLang Diffusion on the OpenAI images API:
    # POST /v1/images/generations. The Hub's MCP image tools talk to exactly
    # that API, so the `openai-images` tag is all the wiring this needs.
    #
    # The undistilled base model: full classifier-free guidance, 28-50 steps.
    # Text-to-image only -- Z-Image-Edit is not released yet.
    #
    # Image: lmsysorg/sglang:v0.5.19-cu130 -- a stable numbered release (not a
    # rolling dev/nightly tag), arm64 manifest present, and Z-Image is in its
    # diffusion registry.
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        #
        # Downloaded to a plain directory, not the HF cache: SGLang resolves a
        # repo id through snapshot_download, and offline that refuses a cached
        # snapshot with any file missing. A local path is loaded as-is.
        ENV HF_HUB_DISABLE_XET=1
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Tongyi-MAI/Z-Image', local_dir='/models/Z-Image', ignore_patterns=['*.jpg', '*.png', '*.webp', 'assets/*'])"
        FROM lmsysorg/sglang:v0.5.19-cu130
        COPY --from=weights /models /models
    image: spark-ai-hub/sglang-z-image:v0.5.19-cu130
    container_name: spark-ai-hub-sglang-z-image
    # No published port: the Hub reaches this container by name through its
    # front door at /run/sglang-z-image/, so it never collides with the LLM
    # or with another image model.
    networks:
      - spark-ai-hub-net
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    shm_size: 16gb
    command:
      - sglang
      - serve
      # The directory name contains "Z-Image" (and not "Turbo"), which is what
      # SGLang's diffusion registry matches to pick the base Z-Image pipeline.
      - --model-path
      - /models/Z-Image
      - --served-model-name
      - Tongyi-MAI/Z-Image
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      # SGLang offloads the DiT and the text encoder to CPU by default for
      # image models, whatever the GPU size. On the Spark CPU and GPU share
      # the same memory, so offload only adds copies back and forth.
      - --dit-cpu-offload
      - "false"
      - --text-encoder-cpu-offload
      - "false"
      # Pinned host buffers are only for fast CPU<->GPU transfer, which
      # unified memory never needs; pinning would lock memory for nothing.
      - --pin-cpu-memory
      - "false"
      - --output-path
      - /tmp/sglang-outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
