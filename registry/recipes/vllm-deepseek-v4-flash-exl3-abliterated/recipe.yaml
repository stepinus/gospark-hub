name: "DeepSeek-V4-Flash-0731 Abliterated (EXL3 3.0bpw)"
slug: vllm-deepseek-v4-flash-exl3-abliterated
version: "1.0.0"
description: "The uncensored path of the EXL3 DeepSeek-V4-Flash-0731 build: same 284B MoE checkpoint, same NVFP4 KV cache, same DSpark K5 decode path and the same speed as the stock sibling, with a published unit-norm refusal direction projected out of the attention output stream of decoder layers 10-42 at runtime. No weights are modified - one 4096-dim matvec per layer, no measurable throughput or KV cost - which is why the quantized Trellis tensors and the DSpark draft stay untouched. Expected effect for this family: ~96% refusals baseline down to ~2% with thinking off and ~13% with thinking on, since the model can still reason its way to a refusal. Removes safety refusals the upstream model was trained to have; supply your own guardrails."
