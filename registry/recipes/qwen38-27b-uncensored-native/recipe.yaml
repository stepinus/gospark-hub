name: "Qwen3.8-27B Uncensored INT4 DFlash2 (native)"
slug: qwen38-27b-uncensored-native
version: "1.0.0"
description: "OrcaRouter's abliterated Qwen3.8-27B (MLX affine 4-bit, group 64, the format the stock TensorFold CUDA engine reads natively) served on the host without a container, with z-lab's DFlash2 drafter. The weights come out of the container image that used to serve this model — the checkpoint is on disk, so launching copies nothing and builds no image. Four streams at the full 262,144-token window fit in 71 GiB of budget after the 15.4 GiB of weights, which is the whole point of dropping the per-model runtime: the image was 74 GB for a 19 GB checkpoint. Images and video work through the checkpoint's own tower, as in the container recipe; the CUDA libraries come from the engine's shared runtime."
author: "spark-ai-hub"
source: "local"
category: llm
logo: "/logos/qwen.png"
tags:
  - llm
  - tensorfold
  - native
  - no-container
  - int4
  - qwen
  - reasoning
  - multimodal
  - vision
  - speculative-decoding
  - long-context
requirements:
  min_memory_gb: 32
  recommended_memory_gb: 48
  disk_gb: 0
  cuda_compute: "12.1"
ui:
  type: api-only
  port: 8890
  proxy: true
  path: "/v1/models"
kind: native
native:
  engine: tensorfold
  # The container recipe serves images through the checkpoint's own tower and
  # carries the CUDA libraries for it; the stock engine reads that tower
  # natively, so only the engine's shared CUDA runtime is needed here.
  vision: true
  runtime_image: "tensorfold-qwen38:zig-db28187"
  # The 4-bit checkpoint and its drafter were extracted from the old
  # per-model image (spark-ai-hub/tensorfold-qwen38-27b-uncensored-int4) into
  # this folder; nothing downloads on launch.
  model: "/home/nvidia/models/qwen38-27b-uncensored/model"
  args:
    - "--name"
    - "Qwen3.8-27B Uncensored INT4 DFlash2 (native)"
    - "--port"
    - "8890"
    - "--context"
    - "262144"
    - "--parallel"
    - "4"
    - "--max-tokens"
    - "32768"
    - "--temperature"
    - "1.0"
    - "--top-p"
    - "0.95"
    - "--top-k"
    - "20"
    - "--thinking"
    - "--vision"
    - "--vision-max-images"
    - "50"
    - "--drafter"
    - "/home/nvidia/models/qwen38-27b-uncensored/drafter"
  port: 8890
status: experimental
engine: "TensorFold"
params_b: 27
arch: dense
quantization: "INT4"
speculative_method: "dflash2"
weights_gb: 15.4
requires_hf_token: false
context_tokens: 262144
integration:
  api_url: "<HUB>/v1"
  model_id: "Qwen3.8-27B Uncensored INT4 DFlash2 (native)"
  api_key: "<API_KEY>"
  max_context: "262144"
