name: "HiDream-O1-Image-Dev-2604"
slug: hidream-o1-image-dev-2604
version: "1.0.0"
description: "Generate and edit images with HiDream-O1-Image-Dev-2604, HiDream's 8B pixel-native unified transformer, served by HiDream's own inference server with its own samplers: text-to-image, instruction editing from one image, and subject personalization from two or more. 28 steps with guidance off. Your coding agents reach it through the Hub's image tools (generate_image / edit_image). MIT license."
author: "HiDream.ai"
source: "community"
website: "https://huggingface.co/HiDream-ai/HiDream-O1-Image-Dev-2604"
upstream: "https://github.com/WaxacaBytes/hidream-o1-spark-ai-hub"
category: image-gen
categories:
  - image-gen
tags:
  - hidream-app
  - text-to-image
  - image-edit
  - multi-image
  - hidream
  - diffusion
  - bf16
icon: "\U0001F5BC️"
logo: "/logos/hidream.png"
requirements:
  min_memory_gb: 40
  recommended_memory_gb: 56
  disk_gb: 90
  cuda_compute: "12.1"
ui:
  # HiDream's server also has a web UI at /, but the Hub's MCP image tools call
  # its API. Proxied so the Hub reaches it at /run/hidream-o1-image-dev-2604/
  # with no host port.
  type: api-only
  port: 7860
  proxy: true
  path: "/"
  health_path: "/"
docker:
  build: true
  build_time_minutes: 25
  gpu: true
status: experimental
release_date: "2026-05"
engine: "HiDream"
params_b: 8
arch: dense
quantization: "BF16"
weights_gb: 32.8
render_seconds: 51.0
render_workload: "2048x2048, 28 steps"
load_seconds: 19
requires_hf_token: false
# HiDream's server fixes the schedule per model type (app.py, dev branch): Dev
# runs 28 steps, guidance 0, shift 1, "flash" sampler for text-to-image and
# "flow_match" for edits. Nothing to send; these defaults only document it.
image_defaults:
  notes: "Set by HiDream's server for Dev models: 28 steps, guidance off; flash sampler for text-to-image, flow_match for edits. Native resolution 2048x2048."
  source: "https://github.com/HiDream-ai/HiDream-O1-Image/blob/dev/app.py"
