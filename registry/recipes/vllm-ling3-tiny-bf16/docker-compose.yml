services:
  vllm:
    # Same pinned arm64 nightly as the other Ling-3.0 recipes: the BailingMoeV3
    # `bailing_hybrid` model (Kimi Delta Attention + gated MLA), its KDA state
    # cache and the `ling3` parsers only landed in vLLM on 2026-08-05, newer
    # than every tagged release (v0.27.1 still ships neither). Pinned by digest
    # because vLLM prunes its dated nightly tags from Docker Hub within about a
    # day. Revisit once a stable release carries `bailing_hybrid`.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('inclusionAI/Ling-3.0-tiny')"
        FROM vllm/vllm-openai@sha256:01945934eb699a136507c44ca30618f508c465621230247ff4e3356462e14fcb
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/vllm-ling3-tiny-bf16:01945934eb699a136507c44ca30618f508c465621230247ff4e3356462e14fcb
    container_name: spark-ai-hub-vllm-ling3-tiny-bf16
    networks:
      - spark-ai-hub-net
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      # DGX Spark (GB10 Blackwell, sm_121a).
      - CUTE_DSL_ARCH=sm_121a
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      # This is the unquantized BF16 release. It replaces the former
      # `vllm-ling3-tiny-fp8` recipe: inclusionAI's FP8 checkpoint is
      # *block-scaled* with `scale_fmt: ue8m0` and stores weight_scale_inv as
      # `torch.float8_e8m0fnu`, which no kernel available on GB10 (sm_121a)
      # consumes correctly -- DeepGEMM and CUTLASS both abort at load, and the
      # Triton block-scaled fallback runs but misreads the e8m0 scales and
      # emits token soup. BF16 needs no kernel overrides at all.
    ipc: host
    command:
      - --model
      - inclusionAI/Ling-3.0-tiny
      - --port
      - "8000"
      - --trust-remote-code
      - --served-model-name
      - inclusionAI/Ling-3.0-tiny
      # Model card: KDA state cache must use the aligned layout.
      - --mamba-cache-mode
      - align
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - ling3
      - --reasoning-parser
      - ling3
      # NOTE: config.json claims `num_nextn_predict_layers: 1`, but the
      # safetensors index stops at layer 23 -- no NEXTN/MTP head is actually
      # shipped. Do NOT add `--speculative-config '{"method":"mtp"}'`; there
      # are no weights to load for it.
      #
      # The checkpoint is trained to 128K and the model card extends it to 256K
      # with YaRN (factor 2.0) -- config.json ships no rope_scaling, so the
      # scaling has to be injected the same way the card's SGLang command does.
      - --hf-overrides
      - '{"rope_scaling":{"rope_type":"yarn","factor":2.0,"original_max_position_embeddings":131072}}'
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "16"
      - --gpu-memory-utilization
      # Right-sized on GB10 (121.69 GiB visible). BF16 weights are ~14.7 GiB, so
      # 0.21 measures 1,492,820 KV tokens = 5.69x concurrency at the full
      # 262144 context, comfortably covering the 16 scheduled sequences while
      # handing the rest of the box back.
      - "0.21"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
