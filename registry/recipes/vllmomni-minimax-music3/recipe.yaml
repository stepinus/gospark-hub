name: "MiniMax-Music3"
slug: vllmomni-minimax-music3
version: "1.0.0"
description: "Compose full songs with vocals and instruments from lyrics and a style description using MiniMax-Music3, up to six minutes of 32 kHz stereo. Served by vLLM-Omni; your coding agents reach it through the Hub's music tool (generate_music). See the model card for license terms."
author: "MiniMax"
source: "community"
website: "https://huggingface.co/MiniMaxAI/MiniMax-Music3"
