description: "Qwen3.8-27B in turboderp's EXL3 2.0 bpw quant — 9.71 GB of weights, the smallest Qwen3.8-27B in the hub — served by ExLlamaV3 through MiaAI Lab's OpenAI-compatible server. Built to run next to an image or video model: the server hard-caps itself at 16 GB, and inside that cap it holds the full 262K context (int4 KV), MTP speculative decoding off the checkpoint's own head, the vision tower and tool calling. EXL3's trellis quantization keeps 2 bpw usable; turboderp rates it 'fair' (mean KL 0.35 vs BF16), so pick an NVFP4 build when the Spark is free and quality matters most. Requests are served one at a time."
