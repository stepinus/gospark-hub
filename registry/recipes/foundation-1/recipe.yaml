name: "Foundation-1"
slug: foundation-1
version: "1.0.0"
description: "Generate tempo-synced, key-aware musical loops and production-ready samples from text prompts with Foundation-1, using structured controls for instrumentation, timbre, effects, BPM, bars, and notation-aware prompting."
author: "RoyalCities"
source: "spark-ai-hub"
website: "https://huggingface.co/RoyalCities/Foundation-1"
upstream: "https://github.com/WaxacaBytes/foundation-1-spark-ai-hub"
fork: "https://github.com/RoyalCities/RC-stable-audio-tools"
category: multi-modal
tags:
  - audio
  - music-generation
  - sample-generation
  - gradio
  - loop-generation
icon: "🎵"
logo: "/logos/foundation1-official.png"
requirements:
  min_memory_gb: 20
  recommended_memory_gb: 40
  disk_gb: 40
  cuda_compute: "12.1"
ui:
  type: web
  # Port inside the container. Nothing is published to the host:
  # the app is served at /run/foundation-1/ on the Hub's own port.
  port: 7860
  proxy: true
  path: "/"
docker:
  build: false
  build_time_minutes: 10
  gpu: true
status: community-verified
release_date: "2026-03"

cover:
  image: real-foundation1.jpg
  backdrop:
    image: hero-foundation1.jpg
  caption: "Foundation-1's banner, from RoyalCities' model card."
  grade: false
  credit: "Foundation-1 banner, RoyalCities"
  source: "https://huggingface.co/RoyalCities/Foundation-1"
