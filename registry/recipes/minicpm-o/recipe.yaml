name: "MiniCPM-o 2.6"
slug: minicpm-o
version: "1.0.0"
description: "Streaming multimodal chat with MiniCPM-o 2.6 — talk to your camera in real time, ask questions about what the AI sees, and get spoken answers back. Vision + speech + text, all on-device."
author: "OpenBMB"
source: "spark-ai-hub"
website: "https://github.com/OpenBMB/MiniCPM-o"
upstream: "https://github.com/WaxacaBytes/minicpm-o-spark-ai-hub"
fork: "https://github.com/OpenBMB/MiniCPM-o"
category: multimodal
tags:
  - multimodal
  - vision
  - speech
  - webcam
  - streaming
  - chat
icon: "\U0001F441"
requirements:
  min_memory_gb: 24
  recommended_memory_gb: 32
  disk_gb: 40
  cuda_compute: "12.1"
ui:
  type: web
  # Port inside the container. Nothing is published to the host:
  # the app is served at /run/minicpm-o/ on the Hub's own port.
  port: 7860
  proxy: true
  path: "/"
docker:
  build: false
  build_time_minutes: 15
  gpu: true
status: community-verified
release_date: "2026-02"

cover:
  image: real-minicpm-o.jpg
  backdrop:
    image: hero-minicpm-o.jpg
  caption: "A question MiniCPM-o answers by reading the photograph, from OpenBMB's demo."
  grade: false
  credit: "MiniCPM-o reasoning demo, OpenBMB"
  source: "https://github.com/OpenBMB/MiniCPM-o/blob/main/assets/minicpmo4_5/en_cot.png"
