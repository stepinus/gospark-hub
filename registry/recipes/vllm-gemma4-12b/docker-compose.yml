services:
  vllm:
    # gemma-4-12B-it is the "Unified" (gemma4_unified) arch. Pinned to vLLM's
    # dedicated, purpose-built gemma4-unified image (cu130 = matches the host
    # CUDA 13 driver). It's a permanent named tag (not a rolling nightly or a
    # pruned SHA), so clean from-scratch reinstall works. Verified to serve
    # gemma-4-12B-it on this DGX Spark.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('google/gemma-4-12B-it')"
        FROM vllm/vllm-openai:gemma4-unified-arm64-cu130
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/vllm-gemma4-12b:gemma4-unified-arm64-cu130
    container_name: spark-ai-hub-vllm-gemma4-12b
    networks:
      - spark-ai-hub-net
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    command:
      - --model
      - google/gemma-4-12B-it
      - --port
      - "8000"
      - --max-model-len
      - "262144"
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --default-chat-template-kwargs
      - '{"enable_thinking": true}'
      - --gpu-memory-utilization
      - "0.45"
      - --kv-cache-dtype
      - fp8_e4m3
      - --reasoning-parser
      - gemma4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
