name: "Qwen-Image-2512 NVFP4"
slug: sglang-qwen-image-2512-nvfp4
version: "1.0.0"
description: "Generate images with Qwen-Image-2512, Alibaba's 20B text-to-image model known for realistic people, fine natural detail and accurate text in images, in the SGLang team's NVFP4 build (30 GB instead of 58). Served by SGLang Diffusion on the OpenAI images API; your coding agents reach it through the Hub's image tools (generate_image). The LMSYS checkpoint does not name a license."
author: "Qwen (Alibaba) · NVFP4 by LMSYS"
source: "community"
website: "https://huggingface.co/lmsys/qwen-image-2512-modelopt-nvfp4-sglang"
upstream: "https://huggingface.co/Qwen/Qwen-Image-2512"
category: image-gen
categories:
  - image-gen
tags:
  - openai-images
  - text-to-image
  - qwen
  - diffusion
  - sglang
  - nvfp4
icon: "\U0001F5BC️"
logo: "/logos/qwen.png"
requirements:
  min_memory_gb: 36
  recommended_memory_gb: 48
  disk_gb: 70
  cuda_compute: "12.1"
ui:
  # No web page of its own: the Hub's MCP image tools call its API. Proxied so
  # the Hub reaches it at /run/sglang-qwen-image-2512-nvfp4/ with no host port.
  type: api-only
  port: 30000
  proxy: true
  path: "/v1/models"
  health_path: "/health"
docker:
  build: true
  build_time_minutes: 20
  gpu: true
status: experimental
release_date: "2025-12"
engine: "SGLang"
params_b: 20
arch: dense
quantization: "NVFP4"
weights_gb: 30.4
requires_hf_token: false
# The Hub's image tools use these whenever an agent leaves them unset. Steps are
# the Hub owner's choice for speed; the model card's quickstart only shows 50.
# true_cfg_scale 4.0 is the card's example value.
image_defaults:
  steps: 16
  true_cfg_scale: 4.0
  notes: "16 steps is this Hub's speed/quality choice; the model card's example uses 50 for maximum detail."
  source: "https://huggingface.co/Qwen/Qwen-Image-2512"
