name: "Qwen3.8-Flash-Next Uncensored NVFP4 (PLE mmap)"
slug: vllm-qwen38-flash-next-uncensored-nvfp4-ple-mmap
version: "1.0.0"
description: "The uncensored path of the Qwen3.8-Flash-Next single-Spark build — Keys' abliterated checkpoint, which is Mia-AiLab's NVFP4 quantization of Qwen3.8-Flash-Next with the QSA attention output projection spliced and requantized at nine layers (15 through 47). The PLE table, the routed experts, the MTP draft head and the chat template are untouched, so nine of the thirty-four shards differ in content and none differ in length: it is the same 98.7 GiB, the same architecture, the same memory arithmetic, and every serving flag carries over unchanged. That means the whole single-Spark configuration comes with it — the 26.8 GiB PLE n-gram table pre-packed at build time and memory-mapped into vLLM's CPU offload worker so it sits in evictable page cache instead of competing with KV for the Spark's one unified pool, an FP8 KV cache holding roughly a million tokens at the native 262K context, MTP speculative decoding on a reduced 65,536-token draft vocabulary, and BF16 recurrent state. Unlike the abliterated builds elsewhere in the hub, this is not a refusal direction projected out at runtime: the weights themselves were edited, which is why it is a model of its own rather than a runtime switch. Vision, tool calling and reasoning all work; OpenAI-compatible API. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty. Removes safety refusals the upstream model was trained to have; supply your own guardrails. The weights are behind a Hugging Face terms gate (18+): accept them on the checkpoint page with the account whose token the Hub holds, or the install fails with a 403."
