services:
  vllm:
    build:
      secrets:
        - hf_token
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4')"
        FROM vllm/vllm-openai:v0.20.0-aarch64-cu130
        RUN pip install --no-cache-dir "vllm[audio]" \
         && pip cache purge || true
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/vllm-nemotron3-nano-omni-30b-a3b-nvfp4:v0.20.0-aarch64-cu130
    container_name: spark-ai-hub-vllm-nemotron3-nano-omni-30b-a3b-nvfp4
    networks:
      - spark-ai-hub-net
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    command:
      - --model
      - nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "262144"
      - --tensor-parallel-size
      - "1"
      - --trust-remote-code
      - --enable-prefix-caching
      - --reasoning-parser
      - nemotron_v3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --video-pruning-rate
      - "0.5"
      - --max-num-seqs
      - "384"
      - --max-num-batched-tokens
      - "8192"
      - --allowed-local-media-path
      - /
      - --media-io-kwargs
      - '{"video": {"fps": 2, "num_frames": 256}}'
      - --kv-cache-dtype
      - fp8
      - --gpu-memory-utilization
      - "0.26"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
