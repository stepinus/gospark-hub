name: "Deep-Live-Cam"
slug: deep-live-cam
version: "1.1.0"
description: "Perform real-time face swaps on images, videos, and webcam streams with Deep-Live-Cam, using InsightFace and GFPGAN for high-quality single-image face replacement. Live webcam tuned for smoothness on DGX Spark (cached source face, tunable detection size)."
author: "hacksider"
source: "spark-ai-hub"
website: "https://github.com/hacksider/Deep-Live-Cam"
upstream: "https://github.com/WaxacaBytes/deep-live-cam-spark-ai-hub"
fork: "https://github.com/hacksider/Deep-Live-Cam"
category: image-gen
tags:
  - face-swap
  - deepfake
  - webcam
  - onnxruntime
  - video
icon: "\U0001F3AD"
logo: "/logos/deep-live-cam.png"
requirements:
  min_memory_gb: 8
  recommended_memory_gb: 16
  disk_gb: 12
  cuda_compute: "12.1"
ui:
  type: web
  # Port inside the container. Nothing is published to the host:
  # the app is served at /run/deep-live-cam/ on the Hub's own port.
  port: 7860
  proxy: true
  path: "/"
docker:
  build: true
  build_time_minutes: 2
  gpu: true
status: community-verified
release_date: "2023-09"

cover:
  image: real-deep-live-cam.jpg
  backdrop:
    image: hero-deep-live-cam.jpg
  caption: "A frame from Deep-Live-Cam's own streamer demo reel."
  grade: false
  credit: "Deep-Live-Cam demo reel, hacksider"
  source: "https://github.com/hacksider/Deep-Live-Cam/blob/main/media/streamers.gif"
