name: "Muse Glimmer 30B"
slug: vllm-muse-glimmer-30b
version: "1.0.0"
description: "Meta's Muse Glimmer 30B at full BF16 precision — a dense multimodal agentic model (52 layers, 6656 hidden, gated sliding-window attention) with a 1.8B ViT-G/14 perception encoder, distilled from Muse Spark for autonomous tool use, reasoning, and failure recovery on local hardware. Served on vLLM's dedicated Muse Glimmer image with muse_glimmer tool + reasoning parsing, 128K context. Reasoning model: allow 2000+ max_tokens or the visible answer comes back empty (the chain-of-thought arrives in `reasoning`)."
author: "Meta"
source: "official"
website: "https://huggingface.co/meta-models/Muse-Glimmer-30B"
