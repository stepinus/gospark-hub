services:
  qwen-image-2512:
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen-Image-2512')"
        FROM ghcr.io/waxacabytes/qwen-image-2512-spark-ai-hub:latest
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/qwen-image-2512:latest
    container_name: spark-ai-hub-qwen-image-2512
    # No published port: the front-door proxy reaches this container
    # by name on the shared network, so nothing can collide and the
    # whole Hub stays behind one port.
    networks:
      - spark-ai-hub-net
    environment:
      GRADIO_ROOT_PATH: "/run/qwen-image-2512"
      PORT: "7860"
      OUTPUT_DIR: "/data/output"
      HF_HOME: "/root/.cache/huggingface"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-1}"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    volumes:
      - qwen-image-2512-output:/data/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  qwen-image-2512-output:

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
