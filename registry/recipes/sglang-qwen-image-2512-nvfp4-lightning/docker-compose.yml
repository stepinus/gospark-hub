services:
  sglang:
    # Qwen-Image-2512 in NVFP4 (the SGLang team's ModelOpt checkpoint) plus
    # lightx2v's 4-step Lightning LoRA, served by SGLang Diffusion on the OpenAI
    # images API. 4 steps at CFG 1 instead of the base model's long schedule.
    #
    #   * lmsys/qwen-image-2512-modelopt-nvfp4-sglang: transformer blocks in
    #     NVFP4 except the first and last two; text encoder and VAE BF16.
    #   * lightx2v/Qwen-Image-2512-Lightning: the 4-step V1.0 LoRA in BF16
    #     (0.8 GB), the same distillation Comfy-Org's ComfyUI template uses.
    #
    # The transformer stays NVFP4, so the LoRA runs dynamically beside it
    # (--lora-merge-mode dynamic) instead of being merged into packed weights.
    #
    # Image: lmsysorg/sglang:v0.5.19-cu130 -- a stable numbered release (not a
    # rolling dev/nightly tag), arm64 manifest present, and this model is in
    # its diffusion registry.
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        #
        # Downloaded to a plain directory, not the HF cache: SGLang resolves a
        # repo id through snapshot_download, and offline that refuses a cached
        # snapshot with any file missing. A local path is loaded as-is.
        ENV HF_HUB_DISABLE_XET=1
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import snapshot_download; snapshot_download('lmsys/qwen-image-2512-modelopt-nvfp4-sglang', local_dir='/models/qwen-image-2512-modelopt-nvfp4-sglang', ignore_patterns=['*.jpg', '*.png', '*.webp', 'assets/*'])"
        RUN python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('lightx2v/Qwen-Image-2512-Lightning', 'Qwen-Image-2512-Lightning-4steps-V1.0-bf16.safetensors', local_dir='/models/lora')"
        FROM lmsysorg/sglang:v0.5.19-cu130
        COPY --from=weights /models /models
    image: spark-ai-hub/sglang-qwen-image-2512-nvfp4-lightning:v0.5.19-cu130
    container_name: spark-ai-hub-sglang-qwen-image-2512-nvfp4-lightning
    # No published port: the Hub reaches this container by name through its
    # front door at /run/sglang-qwen-image-2512-nvfp4-lightning/, so it never
    # collides with the LLM or with another image model.
    networks:
      - spark-ai-hub-net
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      # SGLang wraps the dynamic LoRA forward in @torch.compile, which fails on
      # this image's torch 2.13 ("'torch.Stream' object has no attribute
      # 'cuda_stream'"). Disabling TorchDynamo runs that forward eagerly;
      # SGLang's own --enable-torch-compile is off by default anyway.
      - TORCHDYNAMO_DISABLE=1
    ipc: host
    shm_size: 16gb
    command:
      - sglang
      - serve
      # SGLang's diffusion registry picks the pipeline by matching the model
      # name inside this directory path.
      - --model-path
      - /models/qwen-image-2512-modelopt-nvfp4-sglang
      - --served-model-name
      - Qwen/Qwen-Image-2512
      - --lora-path
      - /models/lora
      - --lora-weight-name
      - Qwen-Image-2512-Lightning-4steps-V1.0-bf16.safetensors
      - --lora-nickname
      - lightning-4step
      - --lora-merge-mode
      - dynamic
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      # SGLang offloads the DiT and the text encoder to CPU by default for
      # image models, whatever the GPU size. On the Spark CPU and GPU share
      # the same memory, so offload only adds copies back and forth.
      - --dit-cpu-offload
      - "false"
      - --text-encoder-cpu-offload
      - "false"
      # Pinned host buffers are only for fast CPU<->GPU transfer, which
      # unified memory never needs; pinning would lock memory for nothing.
      - --pin-cpu-memory
      - "false"
      - --output-path
      - /tmp/sglang-outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
