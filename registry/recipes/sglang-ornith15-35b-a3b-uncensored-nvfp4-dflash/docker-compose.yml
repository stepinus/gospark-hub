services:
  sglang:
    # The uncensored Ornith-1.5-35B-A3B (ressl's abliterated NVFP4 master) on
    # SGLang with ornith-ai's own DFlash drafter at its native block size of
    # 16. A sibling of the DFlash2 recipe, same engine, weights and flags:
    # longer blocks win on code edits, where whole blocks are accepted
    # (244.1 tok/s against 179.4), and lose on writing (56.9 against 64.3).
    # Block 8 was measured too: 64.8/154.3, no better than DFlash2.
    #
    # SGLang can run DFlash here, unlike on the official Ornith NVFP4 build,
    # because this checkpoint keeps lm_head in BF16 and DFlash's greedy head
    # reads the target's head directly.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('ressl/Ornith-1.5-35B-A3B-uncensored-NVFP4', revision='64ec91a170f0d42048db662bf4ad6a8d54b680a9'); snapshot_download('ornith-ai/Ornith-1.5-35B-A3B-DFlash', revision='942d20fee84d04c9ecbf18e9c6fc4144914a1d5d', allow_patterns=['config.json', '*.safetensors'], local_dir='/drafter')"
        FROM lmsysorg/sglang:dev-nightly-0820
        COPY --from=weights /weights /root/.cache/huggingface
        COPY --from=weights /drafter /models/Ornith-1.5-35B-A3B-DFlash
    image: spark-ai-hub/sglang-ornith15-35b-a3b-uncensored-nvfp4-dflash:dev-nightly-0820
    container_name: spark-ai-hub-sglang-ornith15-35b-a3b-uncensored-nvfp4-dflash
    networks:
      - spark-ai-hub-net
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    shm_size: 32gb
    command:
      - sglang
      - serve
      - --model-path
      - ressl/Ornith-1.5-35B-A3B-uncensored-NVFP4
      - --revision
      - 64ec91a170f0d42048db662bf4ad6a8d54b680a9
      - --served-model-name
      - ressl/Ornith-1.5-35B-A3B-uncensored-NVFP4
      - --trust-remote-code
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # SM121 (GB10) has no trtllm_mha path; flashinfer is the cookbook's
      # backend for every Blackwell SM120/SM121 card.
      - --attention-backend
      - flashinfer
      - --kv-cache-dtype
      - fp8_e4m3
      # Marlin for the NVFP4 MoE, as the drafter's own DGX Spark evaluation ran
      # it.
      - --moe-runner-backend
      - marlin
      - --chunked-prefill-size
      - "2048"
      # Weights are only 22.3GB here, so the static pool is generous at 0.50
      # and still leaves the GDN state and KV room for full native context.
      - --mem-fraction-static
      - "0.50"
      - --max-total-tokens
      - "262144"
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      # Hybrid Gated DeltaNet needs its recurrent state handled explicitly:
      # both flags come from the drafter card's own Spark evaluation.
      - --mamba-radix-cache-strategy
      - extra_buffer
      - --mamba-ssm-dtype
      - float32
      # DFlash block-diffusion drafting at the drafter's native block of 16.
      - --speculative-algorithm
      - "DFLASH"
      - --speculative-draft-model-path
      - /models/Ornith-1.5-35B-A3B-DFlash
      - --speculative-dflash-block-size
      - "16"
      - --speculative-draft-attention-backend
      - flashinfer
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
