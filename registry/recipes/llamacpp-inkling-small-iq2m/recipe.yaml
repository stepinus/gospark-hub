name: "Inkling-Small 276B (UD-IQ2_M)"
slug: llamacpp-inkling-small-iq2m
version: "1.0.0"
description: "Thinking Machines Inkling-Small, a 276B sparse MoE (12B active, 256 experts) at Unsloth Dynamic 2-bit (UD-IQ2_M, ~82GB), served via a llama.cpp built native for the DGX Spark (ARM64 + CUDA 13). OpenAI-compatible API, 256K context. Reasoning model: it thinks before answering, so allow 2000+ max_tokens or the visible answer comes back empty (the chain-of-thought arrives in reasoning_content)."
author: "Thinking Machines"
source: "community"
website: "https://huggingface.co/thinkingmachines/Inkling-Small"
upstream: "https://huggingface.co/unsloth/Inkling-Small-GGUF"
category: llm
tags:
  - llm
  - moe
  - gguf
  - llama-cpp
  - reasoning
  - thinking-machines
  - inkling
  - 2-bit
  - iq2_m
  - long-context
  - tool-use
logo: "/logos/inkling.png"
requirements:
  min_memory_gb: 100
  recommended_memory_gb: 128
  disk_gb: 85
  cuda_compute: "12.1"
ui:
  type: api-only
  port: 8080
  proxy: true
  path: "/v1/models"
docker:
  build: true
  build_time_minutes: 6
  gpu: true
status: community-verified
engine: "llama.cpp"
params_b: 276
active_params_b: 12
arch: moe
quantization: "IQ2_M"
speculative_method: ""
artificial_analysis_index: 32
weights_gb: 82.4
release_date: "2026-07-30"
tested_on:
  dgx_os: "7.2"
  date: "2026-07-30"
tokens_per_second: 22.2
tokens_per_second_editing: 22.2
editing_workload: "code-edit"
benchmarks:
  prose: 21.96
  explainer: 22.21
  code: 22.4
  code-edit: 22.2
integration:
  api_url: "<HUB>/v1"
  model_id: "inkling-small"
  api_key: "<API_KEY>"
  curl_example: "curl <HUB>/v1/chat/completions -H 'Authorization: Bearer <API_KEY>' -H 'Content-Type: application/json' -d '{\"model\": \"inkling-small\", \"messages\": [{\"role\": \"user\", \"content\": \"Hello\"}]}'"

