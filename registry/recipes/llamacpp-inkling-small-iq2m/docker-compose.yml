services:
  llama-server:
    # llama.cpp built with the TML Inkling architecture (upstream PR #25731,
    # not yet in mainline), native for the DGX Spark (ARM64 + CUDA 13, sm_121).
    image: ghcr.io/waxacabytes/inkling-llamacpp-spark-ai-hub:latest
    # Built locally at install time — no registry ships an Inkling-capable
    # llama.cpp yet. Layers are compiled once and cached; relaunch is offline.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        # --- weights stage ---------------------------------------------------
        # Model weights are part of the app artifact: baked into the final image
        # below, so `docker rmi` reclaims every byte this recipe introduced.
        FROM python:3.13-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('unsloth/Inkling-Small-GGUF', allow_patterns=['*UD-IQ2_M/Inkling-Small-UD-IQ2_M-*-of-00003.gguf*'])"
        # ---------------------------------------------------------------------

        # inkling-llamacpp-spark-ai-hub — llama.cpp with the TML Inkling architecture
        #
        # Inkling is NOT in mainline llama.cpp yet. Support lives in an open upstream PR:
        #
        #   PR     : https://github.com/ggml-org/llama.cpp/pull/25731  ("Add TML Inkling architecture")
        #   author : danielhanchen (Unsloth) — the same person who produced the GGUFs
        #   branch : https://github.com/danielhanchen/llama.cpp  @ add-inkling
        #
        # The PR adds the arch/graph build, a banded flash-attention kernel, and int64
        # indexing fixes needed by the 256-expert MoE. We build that branch natively for
        # the DGX Spark (ARM64 + CUDA 13, GB10 sm_121) instead of carrying patch files,
        # because the change set spans 62 files and is still moving upstream.
        #
        # The commit is PINNED. Bumping it means re-verifying that the model still loads
        # and still produces coherent output — do not bump casually.

        # ── Stage 1: build ───────────────────────────────────────────────────────────
        FROM nvcr.io/nvidia/cuda:13.0.1-devel-ubuntu24.04 AS build

        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update && apt-get install -y --no-install-recommends \
                git cmake ninja-build build-essential \
                libcurl4-openssl-dev ca-certificates \
            && rm -rf /var/lib/apt/lists/*

        ARG LLAMA_REPO=https://github.com/danielhanchen/llama.cpp.git
        ARG LLAMA_COMMIT=d69b7e606af7f59d9e81c5c81a5c7ce0dad197e1
        ARG CUDA_ARCH=121

        WORKDIR /src
        RUN git clone $${LLAMA_REPO} . \
            && git checkout -q $${LLAMA_COMMIT}

        # Build server + cli with CUDA (GB10 = sm_121), curl for -hf cache resolution.
        # Static ggml (default) so the CUDA driver stub links into the binaries; shared
        # libs leave libggml-cuda.so with undefined cuMem* driver symbols on aarch64.
        # Add the sbsa driver-stub search path so -lcuda resolves at link time (the real
        # libcuda.so.1 is provided by the NVIDIA runtime at container start).
        RUN cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DGGML_CUDA=ON \
                -DCMAKE_CUDA_ARCHITECTURES=$${CUDA_ARCH} \
                -DLLAMA_BUILD_SERVER=ON \
                -DLLAMA_CURL=ON \
                -DLLAMA_OPENSSL=OFF \
                -DCMAKE_EXE_LINKER_FLAGS="-L/usr/local/cuda-13.0/targets/sbsa-linux/lib/stubs -lcuda" \
                -DCMAKE_SHARED_LINKER_FLAGS="-L/usr/local/cuda-13.0/targets/sbsa-linux/lib/stubs -lcuda" \
            && cmake --build build --config Release -j "$(nproc)" \
                --target llama-server llama-cli \
            # Copy the built binaries + their shared libs (llama.cpp emits both into
            # build/bin) directly; `cmake --install` would try to install unbuilt tests.
            && mkdir -p /opt/llama/bin \
            && cp -a build/bin/. /opt/llama/bin/

        # ── Stage 2: runtime ─────────────────────────────────────────────────────────
        FROM nvcr.io/nvidia/cuda:13.0.1-runtime-ubuntu24.04

        ENV DEBIAN_FRONTEND=noninteractive
        # python3 + huggingface_hub are required so the Hub's install-time prefetch
        # (runs `python3 -c "...snapshot_download..."` inside this image) can cache the
        # GGUF weights. hf_xet accelerates the large (~82GB) download.
        RUN apt-get update && apt-get install -y --no-install-recommends \
                libcurl4 libgomp1 ca-certificates \
                python3 python3-pip \
            && pip install --no-cache-dir --break-system-packages "huggingface_hub[hf_xet]" \
            && rm -rf /var/lib/apt/lists/*

        COPY --from=build /opt/llama /opt/llama

        ENV PATH="/opt/llama/bin:$${PATH}" \
            LD_LIBRARY_PATH="/opt/llama/bin:$${LD_LIBRARY_PATH}"

        EXPOSE 8080
        ENTRYPOINT ["/opt/llama/bin/llama-server"]

        COPY --from=weights /weights /root/.cache/huggingface
    container_name: spark-ai-hub-llamacpp-inkling-small-iq2m
    command:
      - -hf
      - unsloth/Inkling-Small-GGUF
      # Unsloth ships each quant in its own subdirectory; naming shard 1 makes
      # the Hub's install-time prefetch pull all 3 shards (~82GB).
      - --hf-file
      - UD-IQ2_M/Inkling-Small-UD-IQ2_M-00001-of-00003.gguf
      - --alias
      - inkling-small
      - -ngl
      - "999"
      # Native context is 1M; capped at 256K to keep KV within 128GB unified
      # memory alongside the ~82GB of weights. 35 of 42 layers are local
      # (sliding window 512), so only the 7 global layers hold a full-length KV.
      - -c
      - "262144"
      - -fa
      - "on"
      # KV cache MUST stay f16. Inkling applies a short convolution (sconv) over
      # K/V, which copies cache tensor -> cache tensor; ggml_cuda_cpy has no
      # q8_0 -> q8_0 kernel, so `-ctk q8_0 -ctv q8_0` aborts during warmup with
      #   cpy.cu:609: unsupported type combination (q8_0 to q8_0)
      # This is affordable here: 35 of the 42 layers are local (sliding window
      # 512), so only the 7 global layers carry a full-length KV cache.
      # Use the chat template embedded in the GGUF.
      - --jinja
      # Never touch the network at launch — weights are prefetched at install.
      - --offline
      - --no-mmap
      - --cont-batching
      - -np
      - "1"
      - -t
      - "16"
      - -tb
      - "16"
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
    networks:
      - spark-ai-hub-net
    environment:
      - GGML_CUDA_ENABLE_UNIFIED_MEMORY=1
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - LLAMA_OFFLINE=1
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
