name: "TRELLIS.2"
slug: trellis2-spark
version: "2.0.0"
description: "Generate high-fidelity 3D assets from images with TRELLIS.2, including complex topologies, sharp features, and full PBR materials for detailed textured output."
author: "Microsoft"
source: "spark-ai-hub"
website: "https://github.com/microsoft/TRELLIS.2"
upstream: "https://github.com/microsoft/TRELLIS.2"
category: 3d-gen
categories:
  - 3d-gen
tags:
  - 3d
  - generation
  - trellis
  - microsoft
icon: "🧊"
logo: "/logos/trellis2.png"
requirements:
  min_memory_gb: 32
  recommended_memory_gb: 80
  disk_gb: 40
  cuda_compute: "12.1"
ui:
  type: web
  # Port inside the container. Nothing is published to the host:
  # the app is served at /run/trellis2-spark/ on the Hub's own port.
  port: 12156
  proxy: true
  path: "/"
docker:
  build: true
  build_time_minutes: 5
  gpu: true
status: official
release_date: "2025-11"
requires_hf_token: true

cover:
  image: real-trellis2.jpg
  backdrop:
    image: hero-trellis2.jpg
  caption: "Part of the asset wall from Microsoft's TRELLIS.2 teaser."
  grade: false
  credit: "TRELLIS.2 teaser, Microsoft"
  source: "https://github.com/microsoft/TRELLIS.2/blob/main/assets/teaser.webp"
