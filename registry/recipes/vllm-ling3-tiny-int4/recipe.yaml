name: "Ling-3.0-tiny INT4"
slug: vllm-ling3-tiny-int4
version: "1.0.0"
description: "inclusionAI's official 4-bit build of Ling-3.0-tiny — a 7.9B-total / 1.3B-active hybrid-linear MoE (3 Kimi Delta Attention layers + 1 gated MLA layer per 4-layer block, 128 routed experts + 1 shared) with native hybrid reasoning. Group-32 symmetric INT4 is applied only to the routed experts; attention, the shared expert and lm_head stay BF16, so the smallest checkpoint (5.8 GB) keeps full-precision attention. Served on vLLM with the ling3 reasoning + tool parsers and a 256K YaRN context."
author: "inclusionAI (Ant Group)"
source: "official"
website: "https://huggingface.co/inclusionAI/Ling-3.0-tiny"
