services:
  tensorfold:
    # Qwen3.8-Flash-Next served by TensorFold, a CUDA/MLX inference engine
    # written for this model family, from Vontra's MLX 4-bit checkpoint
    # (affine INT4, group size 32, with the MTP draft head).
    #
    # Recipe shape and every serving flag follow Mia's AI Lab's single-Spark
    # TensorFold recipe, pinned to commit 4c0dea8:
    #   https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark-TensorFold
    #   https://x.com/MiaAI_lab/status/2104934763975131239
    # Their start.sh/scripts/config.sh defaults are written out below as plain
    # `tensorfold serve` flags and TENSORFOLD_* variables.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        # --- weights stage ---------------------------------------------------
        # Model weights are part of the app artifact: baked into the final
        # image below, so `docker rmi` reclaims every byte this recipe added.
        # 35 files, 105.5 GiB, pinned to the checkpoint revision measured.
        FROM python:3.12-slim AS weights
        # 60s read timeout: the default 10s aborts the whole download on a
        # single slow chunk, and this stage pulls 105.5 GiB.
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Vontra/Qwen3.8-Flash-Next-MLX-4bit-MTP', revision='dadefa8066e3be900a0d148d0f5a2f4eb1cf6534', local_dir='/weights', ignore_patterns=['.gitattributes'], max_workers=8)"

        # --- runtime stage ---------------------------------------------------
        # The publisher's image, pinned by digest (tag v0.6.1-797af1d9df4d,
        # also :latest): NVIDIA's nvcr.io/nvidia/pytorch:26.07-py3 (arm64,
        # CUDA 13) with TensorFold v0.6.1 and Mia's one remaining patch,
        # 0002-flash-next-v061: video input and up to 50 images on TensorFold's
        # own Flash Next vision, copy drafts, the prompt-chunk rows override,
        # SSD read-ahead around the n-gram table, first token before the next
        # draft. Live /health totals, draft stats, tiled QSA selection and image
        # input are TensorFold's own since v0.5.0 / v0.6.0.
        FROM ghcr.io/miaai-lab/qwen3.8-flash-next-single-dgx-spark-tensorfold@sha256:667693ccd7eea95d365ee5a17eed97067e13deb131a6e61fbbbbe6f69d0ebc69
        # TensorFold compiles its CUDA extensions on first use into
        # TORCH_EXTENSIONS_DIR (upstream: a host cache mounted at /cache).
        # Compiled here instead, for GB10 (sm_121) only, so they ship inside
        # the image and launch compiles nothing. No GPU is needed to compile:
        # the capability TensorFold asks the driver for is stated instead.
        ENV TORCH_EXTENSIONS_DIR=/opt/tensorfold/torch_extensions \
            TRITON_CACHE_DIR=/tmp/triton \
            TORCH_CUDA_ARCH_LIST=12.1
        RUN <<'PY' python3
        import importlib, pkgutil, torch, tensorfold
        torch.cuda.get_device_capability = lambda *a: (12, 1)
        for m in pkgutil.walk_packages(tensorfold.__path__, "tensorfold."):
            if any(k in m.name for k in ("mlx", "metal", "__main__")):
                continue
            try:
                mod = importlib.import_module(m.name)
            except BaseException:
                continue
            ext = getattr(mod, "_ext", None)
            if callable(ext) and getattr(ext, "__module__", "") == m.name:
                ext()
                print("built", m.name, flush=True)
        PY
        COPY --from=weights /weights /models/Qwen3.8-Flash-Next-MLX-4bit-MTP
    image: spark-ai-hub/tensorfold-qwen38-flash-next-int4:tf-v0.6.1-797af1d9df4d
    container_name: spark-ai-hub-tensorfold-qwen38-flash-next-int4
    networks:
      - spark-ai-hub-net
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    # No mem_limit: with --ple-on-ssd the 29.8 GiB n-gram tables are read
    # from the checkpoint files, i.e. page cache, and a cgroup cap would charge
    # those pages to this container and evict rows a lookup is about to read.
    environment:
      # Offline-first: the checkpoint is in the image and is served from a
      # directory path, so nothing is resolved against the Hub.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      # No "is there a newer TensorFold" call to GitHub at each start.
      - TENSORFOLD_NO_UPDATE_CHECK=1
      # Prompt chunk rows (Mia's patch). 2,048 leaves room for the vision
      # tower; 4,096 is 2-5% faster prefill but only fits with --vision off.
      - TENSORFOLD_PREFILL_ROWS=2048
      # The vision tower's ~0.8 GiB scratch comes from the host reserve while
      # an image or video encodes; startup reserves none for it.
      - TENSORFOLD_VISION_WORKSPACE_MIB=0
      # A request's images share 16,384 visual tokens, each at most 4,096
      # (the image count is --vision-max-images below).
      - TENSORFOLD_IMAGE_TOKENS=16384
      # A request's video token budget (2 frames/s, at most 256 frames).
      - TENSORFOLD_VIDEO_TOKENS=16384
      # Copy drafts ahead of MTP (Mia's patch): faster on replies that
      # repeat the prompt (edits, quotes), prose and code unchanged.
      - TENSORFOLD_MTP_COPY=1
      # TensorFold's budget is MemAvailable minus this reserve. Mia sets the
      # 2 GiB floor; unset, it holds back a tenth of RAM (12.2 GiB) and
      # refuses 5 x 262,144.
      - TENSORFOLD_MEMORY_RESERVE_GIB=2
      - PYTHONUNBUFFERED=1
    # The image's entrypoint (NVIDIA's banner) runs this command.
    command:
      - tensorfold
      - serve
      - /models/Qwen3.8-Flash-Next-MLX-4bit-MTP
      - --host
      - "0.0.0.0"
      - --port
      - "8888"
      - --name
      - Qwen/Qwen3.8-Flash-Next
      # Five requests decoded together, each with the native 262,144-token
      # window: a 1,310,720-token pool of int8 KV (one fp16 scale per 32
      # values), ~22.4 GiB. TensorFold estimates 85.4 GiB for the weights and
      # fixed buffers on v0.6.1; streams grow their caches as their context
      # grows, while memory lasts. A setting that does not fit is refused
      # before weights load, naming a window that does.
      - --parallel
      - "5"
      - --context
      - "262144"
      - --kv-dtype
      - int8
      # At most 6 MTP drafts a round, a chain stopping before a draft under
      # 60% confidence. Upstream's sweep: +3% prose, +4% code over the stock
      # 6/0.30, identical output.
      - --mtp-drafts
      - "6"
      - --mtp-confidence
      - "0.60"
      # Qwen's thinking-mode sampling; a request's own values win.
      - --temperature
      - "1.0"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --thinking
      # Reply length for a request without max_tokens (TensorFold's own 4,096
      # can end a thinking reply before it answers).
      - --max-tokens
      - "32768"
      # Read the 29.8 GiB PLE n-gram tables from the checkpoint on SSD at
      # each lookup instead of holding them resident: that memory goes to
      # the KV pool.
      - --ple-on-ssd
      # Image and video input, the model's own 0.84 GiB tower. Data URLs
      # only; add --vision-urls to let it fetch https:// URLs.
      - --vision
      # Up to 50 images a request (a chat's turns all count).
      - --vision-max-images
      - "50"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # NOT unless-stopped: the server holds most of unified memory, so a boot
    # that fails must stop instead of looping.
    restart: on-failure:1

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
