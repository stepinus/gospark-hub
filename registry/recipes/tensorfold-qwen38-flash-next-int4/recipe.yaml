name: "Qwen3.8-Flash-Next INT4"
slug: tensorfold-qwen38-flash-next-int4
version: "1.0.0"
description: "Qwen3.8-Flash-Next — the first open-weight release of the architecture behind Qwen4, 177B total parameters over a hybrid linear/full attention stack — served by TensorFold, an inference engine written for this model family, following Mia's AI Lab single-Spark recipe. The checkpoint is Vontra's MLX 4-bit build (affine INT4, group size 32) with the MTP draft head. The 29.8 GiB PLE n-gram tables stay on the SSD and are read at each lookup, on a C++ thread pool that fetches a prompt chunk's rows while the GPU works on the previous one. That memory goes to the KV cache: five requests at the full native 262K context each, a 1.3M-token pool of int8 KV. Decoding drafts up to six MTP tokens a round, plus prompt-lookup drafts when the reply repeats the prompt; every draft is verified by the model, so output is unchanged. Images and videos work as OpenAI image_url / video_url parts (data URLs), as do tool calling with typed parameters and reasoning. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
