version: "1.0.0"
description: "Z.AI GLM-5.3-Flash, 320B total / 18B active on a hybrid stack alternating linear attention with DeepSeek-style sparse attention, as an EXL3 K2 pack: a QTIP-style 2-bit MCG trellis applied to the 288 routed MoE experts only, with attention, shared experts, embeddings, lm_head, the vision tower and the MTP block all left at source-native BF16. 91.0 GiB against a GGUF Q2_K_XL build's 108.7 GB, and unlike llama.cpp this runtime uses the checkpoint's own MTP block for speculative decoding, which is where the speed comes from. 64K context. EXPERIMENTAL: served by a community vLLM fork shipped as prebuilt aarch64 wheels; stock vLLM cannot load this pack."
