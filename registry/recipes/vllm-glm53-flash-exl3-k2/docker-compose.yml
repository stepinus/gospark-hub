services:
  vllm:
    # GLM-5.3-Flash as an EXL3 K2 (2-bit MCG trellis) pack on ONE DGX Spark.
    #
    # Why EXL3 rather than a GGUF Q2_K_XL build of the same model: EXL3
    # is a QTIP-style trellis format that quantizes ONLY the 288 routed MoE
    # experts, leaving attention, shared experts, embeddings, lm_head, the
    # vision tower and the MTP block at their source-native BF16. That is
    # 91.0 GiB against the GGUF's 108.7 GB, and — the reason it matters — this
    # runtime actually USES the checkpoint's MTP block for speculative
    # decoding. llama.cpp's `glm5next` ignores it ("model has unused tensor
    # blk.45.nextn.*"), which is why a GGUF build gets no speculator.
    #
    # Stock vLLM cannot serve this pack: it has neither the `exl3`
    # quantization method nor the Glm5Next architecture, and no flag turns
    # them on. Both come from the publisher's prebuilt aarch64 wheels below —
    # these are prebuilt, NOT compiled here.
    #
    #   weights : https://huggingface.co/vcruz305/GLM-5.3-Flash-EXL3-K2
    #   wheels  : https://huggingface.co/vcruz305/GLM-5.3-Flash-EXL3-K2-spark-vllm
    #   recipe  : https://github.com/vcruz305/GLM-5.3-Flash-EXL3-K2-DGX-Spark-recipe
    image: spark-ai-hub/vllm-glm53-flash-exl3-k2:sparkvllm-878631b6
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        # --- wheels stage ----------------------------------------------------
        # Three prebuilt cp312/aarch64/SM121 wheels. No CUDA compile happens
        # here; this stage only downloads them.
        #   vllm                   the engine, carrying the Glm5Next arch
        #   exllamav3              CUDA kernels that decode the 2-bit trellis
        #   glm53_exl3_vllm_plugin registers `exl3` as a vLLM quant method
        FROM python:3.12-slim AS wheels
        ENV HF_HUB_DISABLE_XET=1
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import snapshot_download; snapshot_download('vcruz305/GLM-5.3-Flash-EXL3-K2-spark-vllm', revision='4c2348f756013024a95462caf14b6fd68b8a35a6', local_dir='/wheels', allow_patterns=['*.whl'])"

        # --- weights stage ---------------------------------------------------
        # Model weights are part of the app artifact: baked into the final
        # image, so `docker rmi` reclaims every byte this recipe introduced.
        # `runtime/*` in the repo is an unrelated L40 (x86) serving overlay —
        # excluded so it cannot be mistaken for something this recipe uses.
        FROM python:3.12-slim AS weights
        ENV HF_HUB_DISABLE_XET=1
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('vcruz305/GLM-5.3-Flash-EXL3-K2', revision='ca0bcdae265f7df1e346c57a2b53b8b8f632ee0b', local_dir='/weights', ignore_patterns=['runtime/*', '.gitattributes'], max_workers=8)"

        # Make the model's stock chat template honor enable_thinking. The Hub
        # template always opens a reasoning block even when a caller passes
        # chat_template_kwargs={"enable_thinking": false}; these are the three
        # auditable substitutions from the publisher's
        # scripts/patch_chat_template_thinking.py, applied at build time so no
        # script has to run at launch. Default stays thinking-on.
        RUN python3 - <<'PY'
        from pathlib import Path
        p = Path("/weights/chat_template.jinja"); s = p.read_text()
        PATCHES = [
          ("[gMASK]<sop>\n{%- set effective_reasoning_effort = reasoning_effort if reasoning_effort is defined and reasoning_effort in ['low', 'high'] else 'max' -%}\n",
           "[gMASK]<sop>\n{%- if thinking is defined or enable_thinking is defined -%}\n{%- set thinking_enabled = (thinking if thinking is defined else false) or (enable_thinking if enable_thinking is defined else false) -%}\n{%- else -%}\n{%- set thinking_enabled = true -%}\n{%- endif -%}\n{%- set effective_reasoning_effort = reasoning_effort if reasoning_effort is defined and reasoning_effort in ['low', 'high'] else 'max' -%}\n"),
          ("{%- if effective_reasoning_effort is not none -%}<|system|>Reasoning Effort: {{ effective_reasoning_effort | capitalize }}{%- endif -%}",
           "{%- if thinking_enabled and effective_reasoning_effort is not none -%}<|system|>Reasoning Effort: {{ effective_reasoning_effort | capitalize }}{%- endif -%}"),
          ("    <|assistant|>{{- '<think>' -}}\n{%- endif -%}",
           "    <|assistant|>{{- '<think>' if thinking_enabled else '<think></think>' -}}\n{%- endif -%}"),
        ]
        for old, new in PATCHES:
            assert s.count(old) == 1, old[:60]
            s = s.replace(old, new, 1)
        p.write_text(s)
        print("chat template patched for enable_thinking")
        PY

        # --- runtime stage ---------------------------------------------------
        # CUDA 13.0 devel, not runtime: FlashInfer JIT-compiles its kernels on
        # this box (there are no prebuilt SM121 cubins), so vLLM's
        # has_flashinfer() needs nvcc on PATH at server start. Without it the
        # only sparse-MLA backend for GB10 is rejected and engine init dies
        # with "No valid attention backend found for cuda ... use_sparse=True".
        # ninja is what FlashInfer's JIT shells out to.
        FROM nvidia/cuda:13.0.3-devel-ubuntu24.04
        ENV DEBIAN_FRONTEND=noninteractive
        # python3.12-dev + build-essential are load-bearing: the vLLM wheel
        # pulls `instanttensor`, which publishes no aarch64 wheel and so is
        # compiled from its sdist here. Without the headers it fails on
        # "fatal error: Python.h: No such file or directory".
        RUN apt-get update && apt-get install -y --no-install-recommends \
              python3.12 python3.12-venv python3.12-dev python3-pip \
              build-essential ca-certificates \
         && rm -rf /var/lib/apt/lists/*
        RUN python3.12 -m venv /opt/venv
        ENV PATH=/opt/venv/bin:/usr/local/cuda/bin:$PATH
        RUN pip install --no-cache-dir --upgrade pip \
         && pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cu130 \
              "torch==2.13.0+cu130" "torchvision==0.28.0+cu130"
        RUN --mount=type=bind,from=wheels,source=/wheels,target=/wheels \
            pip install --no-cache-dir /wheels/*.whl
        # The pip conflict warning this prints (vllm wants flashinfer 0.6.17)
        # is expected and must NOT be "fixed" by downgrading — 0.6.18rc10 is
        # the version every published measurement was taken on.
        RUN pip install --no-cache-dir --pre "flashinfer-python==0.6.18rc10" ninja
        COPY --from=weights /weights /models/GLM-5.3-Flash-EXL3-K2
        RUN python -c "import vllm, exllamav3_ext, glm53_exl3_plugin; print('vllm', vllm.__version__)"
    container_name: spark-ai-hub-vllm-glm53-flash-exl3-k2
    networks:
      - spark-ai-hub-net
    ipc: host
    shm_size: 16gb
    environment:
      # Everything is baked in; nothing is fetched at launch.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      # Dispatches the routed experts through the fused EXL3 MoE kernel. The
      # load log must show fused `exl3_moe` at bits=2.
      - EXL3_FUSED_MOE=1
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
    command:
      - vllm
      - serve
      - /models/GLM-5.3-Flash-EXL3-K2
      - --served-model-name
      - glm-5.3-flash-exl3
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --quantization
      - exl3
      # 65536 is the publisher's recommended serving context and the one every
      # 64k measurement was taken at. 131072 allocates and an 81,920-token
      # prompt completes, but a 98,304-token prompt faults inside the EXL3
      # fused-MoE path and takes the engine down, so this stays at 64K.
      - --max-model-len
      - "65536"
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "2048"
      - --kv-cache-dtype
      - fp8
      # 0.91 is the measured value for a 64K context; 0.87 (the 8k default)
      # leaves a materially smaller KV pool.
      - --gpu-memory-utilization
      - "0.91"
      - --no-enable-flashinfer-autotune
      - --enable-prefix-caching
      - --skip-mm-profiling
      - --limit-mm-per-prompt
      - '{"image":4,"video":1}'
      - --tool-call-parser
      - glm47
      - --enable-auto-tool-choice
      - --reasoning-parser
      - glm45
      - --chat-template
      - /models/GLM-5.3-Flash-EXL3-K2/chat_template.jinja
      # Native MTP off the checkpoint's own nextn block — the thing the GGUF
      # sibling cannot do. k=2 measured 15.7-16.5 tok/s against 9.6-9.8 with
      # no speculator. Do NOT add a DFlash sidecar on top of this.
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":2}'
      # Exact target verification sizes are k+1, so 3 must be captured; the
      # rest keep a decode step from padding up to a larger captured graph.
      - --cudagraph-capture-sizes
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "6"
      - "8"
      - "12"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # NOT unless-stopped: the server holds ~91% of unified memory, so a boot
    # that fails its KV check must stop rather than loop.
    restart: on-failure:1

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
