name: "ComfyUI (local build)"
slug: comfyui-local
version: "1.0.0"
description: "The ComfyUI built on this Spark by Workspace/ComfyUI/spark-comfyui.sh (image spark-comfyui:latest, torch cu130 aarch64, SageAttention sm_121): the node graph, the custom nodes, the models on the external disk and everything the panel's agent talks to. The card starts and stops that same container — same name, same mounts, same GPU and 16 GB of shm — so the Hub is now the switchboard and the script keeps working for rebuilds and diagnostics."
author: "ComfyAnonymous"
source: "local"
category: image-gen
categories:
  - image-gen
  - video-gen
  - 3d-gen
  - audio-gen
tags:
  - comfyui
  - image
  - video
  - 3d
  - audio
  - local-build
icon: "🎨"
logo: "/logos/comfyui.png"
requirements:
  min_memory_gb: 8
  recommended_memory_gb: 40
  disk_gb: 0
  cuda_compute: "12.1"
ui:
  type: web
  port: 8188
  path: "/"
docker:
  # The image is built locally by the script; the card only runs it.
  build: false
  gpu: true
status: experimental
release_date: "2023-01"
