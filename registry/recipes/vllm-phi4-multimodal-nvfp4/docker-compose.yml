services:
  vllm:
    # NVIDIA's NVFP4 (ModelOpt) build of Microsoft's Phi-4-multimodal-instruct
    # (text + image + audio in one model). 9.0 GB against the FP8 build's 10.3 GB.
    #
    # This checkpoint declares NO kv_cache scheme at all, so the KV cache stays at
    # the model dtype -- there is nothing to override here, unlike the Qwen3.5-122B
    # NVFP4 checkpoint whose fp8 declaration ships without the matching scales.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('nvidia/Phi-4-multimodal-instruct-NVFP4')"
        FROM vllm/vllm-openai:v0.27.1-aarch64
        # Phi-4-multimodal ships its processor as remote code, and that code imports
        # scipy / peft / backoff / soundfile (audio feature extraction and the
        # vision+speech LoRA adapters). They are baked in here, at build time, so
        # launch never needs the network.
        RUN pip install --no-cache-dir scipy peft backoff soundfile \
         && pip cache purge || true
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/vllm-phi4-multimodal-nvfp4:v0.27.1-aarch64
    container_name: spark-ai-hub-vllm-phi4-multimodal-nvfp4
    networks:
      - spark-ai-hub-net
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    command:
      - --model
      - nvidia/Phi-4-multimodal-instruct-NVFP4
      - --port
      - "8000"
      - --quantization
      - modelopt_fp4
      - --max-model-len
      - "131072"
      - --enable-prefix-caching
      - --trust-remote-code
      - --mm-processor-cache-type
      - shm
      - --mm-encoder-tp-mode
      - data
      - --gpu-memory-utilization
      - "0.25"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
