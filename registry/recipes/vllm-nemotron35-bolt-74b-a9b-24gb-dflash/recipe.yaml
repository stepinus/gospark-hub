name: "Nemotron-3.5 Bolt 74B-A9B 24GB LiLiCorr"
slug: vllm-nemotron35-bolt-74b-a9b-24gb-dflash
version: "1.0.0"
description: "NVIDIA Nemotron-3.5 Bolt (74B total / 9B active), released 2026-10-15: Nemotron 3.5 Super VL compressed and quantization-aware-distilled to native 2-bit (IQ2) so the whole model is 24 GB. A vision-language agent model (text, images and video in) that NVIDIA reports beating Qwen3.6-35B-A3B on Terminal-Bench, GPQA and BrowseComp. Served on vLLM exactly as the model card prescribes: b12x kernels, FP8 KV cache and NVIDIA's LiLiCorr drafter (DFlash, 7 draft tokens), 256K context. OpenAI-compatible API."
author: "NVIDIA"
source: "official"
website: "https://research.nvidia.com/labs/nemotron/Nemotron-3.5-Bolt-24GB/"
