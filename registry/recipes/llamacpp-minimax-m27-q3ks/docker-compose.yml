services:
  vllm:
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('MJPansa/MiniMax-M2.7-REAP-172B-A10B-AutoRound-W4A16')"
        FROM vllm/vllm-openai:minimax27
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/llamacpp-minimax-m27-q3ks:minimax27
    container_name: spark-ai-hub-llamacpp-minimax-m27-q3ks
    networks:
      - spark-ai-hub-net
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
    ipc: host
    command:
      - --model
      - MJPansa/MiniMax-M2.7-REAP-172B-A10B-AutoRound-W4A16
      - --port
      - "8000"
      - --trust-remote-code
      - --max-model-len
      - "65536"
      - --served-model-name
      - minimax-m2.7
      - --gpu-memory-utilization
      - "0.88"
      - --kv-cache-dtype
      - fp8
      - --load-format
      - fastsafetensors
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - minimax_m2
      - --reasoning-parser
      - minimax_m2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
