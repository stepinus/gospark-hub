services:
  vllm:
    # NVIDIA's nvidia/Qwen3.6-27B-NVFP4 card needs a vLLM that understands its
    # W4A16_NVFP4 MIXED_PRECISION weights. Pinned to the *stable release*
    # v0.24.0 (a permanent, pullable tag) rather than a nightly so a clean
    # from-scratch reinstall always works. Do NOT downgrade to a nightly: the
    # SHA-tagged nightlies get garbage-collected from Docker Hub within ~a day,
    # and the empirically-tested alternatives fail on this checkpoint —
    # v0.22.1 crashes on load (missing lm_head.input_scale) and the 0.23.x
    # nightly loads but emits garbage. v0.24.0 loads and serves correctly and
    # is verified on this DGX Spark (cu129 image runs fine on the CUDA 13 host).
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('nvidia/Qwen3.6-27B-NVFP4')"
        FROM vllm/vllm-openai:v0.24.0-aarch64-cu129
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/vllm-qwen36-27b-nvfp4:v0.24.0-aarch64-cu129
    container_name: spark-ai-hub-vllm-qwen36-27b-nvfp4
    networks:
      - spark-ai-hub-net
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      # NVIDIA's recommended DGX Spark (GB10, sm_121a) flashinfer environment.
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - CUTE_DSL_ARCH=sm_121a
    ipc: host
    # Command per NVIDIA's "NVIDIA DGX Spark" serving recipe on the model card.
    # This 27B is a dense hybrid model (linear + full attention, dense MLP), so
    # there are no MoE experts and no --moe-backend / MTP drafter here. The
    # checkpoint bakes kv_cache_quant_algo=FP8, so we serve with fp8 KV on the
    # flashinfer backend (flash_attn rejects fp8 KV on this platform).
    command:
      - --model
      - nvidia/Qwen3.6-27B-NVFP4
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --trust-remote-code
      - --dtype
      - auto
      - --quantization
      - modelopt
      - --kv-cache-dtype
      - fp8
      - --attention-backend
      - flashinfer
      - --gpu-memory-utilization
      # ~14 GiB NVFP4 weights + fp8 KV. 0.45 holds well over 1x 262144-token
      # session on a 128 GiB GB10 while leaving headroom for other services.
      - "0.45"
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "4"
      - --max-num-batched-tokens
      - "8192"
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      # Video: hand frame sampling back to do_sample_frames+fps and allow
      # multiple videos per prompt, per the model card's DGX Spark recipe.
      - --media-io-kwargs
      - '{"video": {"num_frames": -1}}'
      - --limit-mm-per-prompt
      - '{"video": 4}'
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      # The checkpoint ships a multi-token-prediction head (mtp_num_hidden_layers=1),
      # so we use MTP speculative decoding to lift single-stream decode throughput.
      # Unlike DFlash, MTP needs no flash_attn drafter, so it is compatible with the
      # checkpoint's forced fp8 KV cache on the flashinfer backend.
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
