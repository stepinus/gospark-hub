description: "NVIDIA Nemotron-3.5 Lightning (30B total / 3B active) — a hybrid LatentMoE interleaving Mamba-2, MoE and attention layers, in native NVFP4 on vLLM 0.27.1, exactly as NVIDIA's '1x DGX Spark (GB10)' recipe prescribes: Marlin MoE backend, FlashInfer Mamba backend, FP8 KV cache and DSpark speculative decoding (3 draft tokens) from the paired 0.8B block drafter. Serves the card's full validated 1M context. Reasoning, tool use and agentic coding (52.8% SWE-bench Verified); OpenAI-compatible API."
