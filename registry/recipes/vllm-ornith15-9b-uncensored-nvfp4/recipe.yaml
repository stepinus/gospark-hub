description: "ressl's abliterated Ornith-1.5-9B — the dense 9B member of the Ornith family — exported to NVFP4 with ModelOpt and served on vLLM. 8.9 GB of weights, the vision tower intact, 262K context, reasoning and tool calling live. Drafting with ornith-ai's own DFlash drafter: 55.5 tok/s writing, 149.8 code-edit (32.8 without it). The author reports hard refusals down from 767/1120 to 20/1120 across five red-team datasets, with GPQA-Diamond at 60.1% against the base model's 49.5%. Removes safety refusals the upstream model was trained to have; supply your own guardrails."
