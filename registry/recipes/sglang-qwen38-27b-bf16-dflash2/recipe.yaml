description: "Qwen3.8-27B in full BF16 — the reference checkpoint, no quantization — served by SGLang with DFlash2, Inco AI's second-generation block-diffusion drafter. DFlash2 drafts a whole block in one pass and keeps the top candidates at every position; decoding is lossless, so nothing about the speculator changes what the weights would have said. The highest-fidelity Qwen3.8-27B in the hub, at the price of 54 GB of weights. Dense 27B hybrid Gated DeltaNet vision-language model, thinking on by default, 262K context, vision and tool calling live."
