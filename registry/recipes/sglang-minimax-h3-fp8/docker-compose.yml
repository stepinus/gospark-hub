services:
  sglang:
    # MiniMax-H3 (MiniMax) in FP8 with a 4-bit text encoder, served by SGLang
    # Diffusion on the OpenAI videos API: POST /v1/videos queues a job,
    # GET /v1/videos/{id} reports progress, GET /v1/videos/{id}/content serves
    # the MP4 -- H.264 video plus a 32 kHz stereo AAC soundtrack generated
    # with it.
    #
    # The FL2VA partition (text-to-video+audio and first/last-frame tasks),
    # assembled the way SGLang's MiniMax-H3 cookbook composes quantized parts,
    # from the model's publisher and Comfy-Org only:
    #   * MiniMaxAI/MiniMax-H3: FL2VA configs, tokenizer, processor, video VAE
    #     (9.7 GB) and audio VAE -- without its BF16 DiT and text encoder
    #     (62 GB each).
    #   * Comfy-Org/MiniMax-H3: the AdaLN-pruned FL2VA DiT in scaled FP8
    #     (19.5 GB) and the Qwen3-VL-32B text encoder in NVFP4-AWQ (14.6 GB).
    #     Comfy-Org publishes no 4-bit DiT for H3; FP8 is its smallest.
    # Both quantized files are self-describing (Comfy per-tensor markers);
    # SGLang detects FP8, NVFP4 and the pruned AdaLN layout from the
    # safetensors themselves, so no --quantization.
    #
    # Image: lmsysorg/sglang:v0.5.19-cu130 -- a stable numbered release (not a
    # rolling dev/nightly tag), arm64 manifest present, and MiniMax-H3 is in its
    # diffusion registry.
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import snapshot_download; snapshot_download('MiniMaxAI/MiniMax-H3', local_dir='/models/MiniMax-H3', allow_patterns=['model_index.json', 'modular_model_index.json', 'LICENSE', 'FL2VA/*'], ignore_patterns=['FL2VA/transformer/*.safetensors', 'FL2VA/text_encoder/*.safetensors', 'FL2VA/*.index.json'])"
        RUN python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Comfy-Org/MiniMax-H3', local_dir='/models/comfy', allow_patterns=['diffusion_models/minimax_h3_fl2va_pruned_fp8_scaled.safetensors', 'text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors'])"
        FROM lmsysorg/sglang:v0.5.19-cu130
        COPY --from=weights /models /models
    image: spark-ai-hub/sglang-minimax-h3-fp8:v0.5.19-cu130
    container_name: spark-ai-hub-sglang-minimax-h3-fp8
    # No published port: the Hub reaches this container by name through its
    # front door at /run/sglang-minimax-h3-fp8/, so it never collides with
    # the LLM or with another media model.
    networks:
      - spark-ai-hub-net
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    shm_size: 16gb
    command:
      - sglang
      - serve
      # The repo root (its name is what SGLang's registry matches);
      # --model-variant picks the FL2VA partition inside it.
      - --model-path
      - /models/MiniMax-H3
      - --model-variant
      - fl2va
      - --component-weights-paths.transformer
      - /models/comfy/diffusion_models/minimax_h3_fl2va_pruned_fp8_scaled.safetensors
      - --component-weights-paths.text_encoder
      - /models/comfy/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      # SGLang offloads the DiT and the text encoder to CPU by default. On the
      # Spark CPU and GPU share the same memory, so offload only adds copies
      # back and forth.
      - --dit-cpu-offload
      - "false"
      - --text-encoder-cpu-offload
      - "false"
      # Pinned host buffers are only for fast CPU<->GPU transfer, which
      # unified memory never needs; pinning would lock memory for nothing.
      - --pin-cpu-memory
      - "false"
      - --output-path
      - /tmp/sglang-outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
