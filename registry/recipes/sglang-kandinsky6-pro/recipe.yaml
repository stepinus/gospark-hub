name: "Kandinsky-6.0 Pro"
slug: sglang-kandinsky6-pro
version: "1.0.0"
description: "Generate a 5 s video with its own synchronized sound (speech with lip-sync, effects, music) from a text prompt or from a first frame, with Kandinsky Lab's Kandinsky-6.0 Pro, the full 29B model at its standard 50 steps with guidance. Put spoken lines in <S>...<E> and sound descriptions in <AUDCAP>...<ENDAUDCAP>. Served by SGLang Diffusion; your coding agents reach it through the Hub's video tools (generate_video / get_video). MIT."
author: "Kandinsky Lab"
source: "community"
website: "https://huggingface.co/kandinskylab/Kandinsky-6.0-Pro-5s-Diffusers"
upstream: "https://github.com/kandinskylab/kandinsky-6"
category: video-gen
categories:
  - video-gen
tags:
  - openai-videos
  - text-to-video
  - image-to-video
  - video-audio
  - kandinsky
  - diffusion
  - sglang
  - bf16
icon: "\U0001F3AC"
logo: "/logos/kandinsky.png"
requirements:
  min_memory_gb: 100
  recommended_memory_gb: 121
  disk_gb: 200
  cuda_compute: "12.1"
ui:
  # No web page of its own: the Hub's MCP video tools call its API. Proxied so
  # the Hub reaches it at /run/sglang-kandinsky6-pro/ with no host port.
  type: api-only
  port: 30000
  proxy: true
  path: "/v1/models"
  health_path: "/health"
docker:
  build: true
  build_time_minutes: 60
  gpu: true
status: experimental
release_date: "2026-10"
engine: "SGLang"
# The model card's 29B; transformer/config.json: 60 visual blocks at width 4096.
params_b: 29
arch: dense
quantization: "BF16"
weights_gb: 90.0
render_seconds: 6336.0
render_workload: "4.9 s 16:9 clip from a first frame, 864x480, 50 steps"
requires_hf_token: true
# kandinsky/configs/checkpoints/pro.yaml in Kandinsky Lab's repo: 864x480,
# 121 frames at 24 fps (5 s), 50 Euler flow-matching steps, guidance 5.
video_defaults:
  steps: 50
  guidance_scale: 5.0
  fps: 24
  seconds: 5
  max_seconds: 5
  num_frames: 121
  size: "864x480"
  notes: "5 s clips (the checkpoint is trained for 121 frames at 24 fps), 864x480 or 480x864, from text or from a first frame (image). Sound is generated with the picture: write spoken lines as <S>words<E> and sound descriptions as <AUDCAP>...<ENDAUDCAP> inside the prompt. 50 steps at guidance 5, per Kandinsky Lab's pro config."
  source: "https://github.com/kandinskylab/kandinsky-6/blob/main/kandinsky/configs/checkpoints/pro.yaml"
# Gated on Hugging Face (accepted automatically); the build uses the Hub's token.
gated_repos:
  - "kandinskylab/Kandinsky-6.0-Pro-5s-Diffusers"
