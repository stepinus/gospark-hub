services:
  sglang:
    # Kandinsky-6.0 Pro (Kandinsky Lab) served by SGLang Diffusion on
    # the OpenAI videos API: POST /v1/videos queues a job (JSON for
    # text-to-video, multipart with input_reference for image-to-video),
    # GET /v1/videos/{id} reports progress, GET /v1/videos/{id}/content serves
    # the MP4 with its soundtrack. The Hub's MCP video tools drive exactly that.
    #
    # Image: lmsysorg/sglang:v0.5.22-cu130 -- a stable numbered release with an
    # arm64 manifest; native Kandinsky 6 (PR #42743, merged 2026-10-06) ships in
    # it.
    #
    # The repo is gated (accepted automatically): the build downloads it with
    # the Hub's Hugging Face token, passed as a build secret so it never lands
    # in an image layer.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        #
        # A plain directory, not the HF cache: offline, SGLang loads a local
        # path as-is. Its name must keep "Kandinsky-6.0" and not "distill":
        # SGLang picks the Kandinsky 6 pipeline and the standard (50-step,
        # CFG) sampling defaults from the directory name.
        #
        # Xet stays on: the DiT is a single 69.7 GB safetensors file, and the
        # Hub only serves files that large through Xet.
        RUN pip install --no-cache-dir huggingface_hub hf_xet
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" python3 -c "from huggingface_hub import snapshot_download; snapshot_download('kandinskylab/Kandinsky-6.0-Pro-5s-Diffusers', revision='7be18aed6fbd64653c0c4872fddfe4a3e3e109f5', local_dir='/models/Kandinsky-6.0-Pro-5s-Diffusers', ignore_patterns=['assets/*', '*.mp4', '*.gif', '*.jpg', '*.png'])"
        FROM lmsysorg/sglang:v0.5.22-cu130
        COPY --from=weights /models /models
    image: spark-ai-hub/sglang-kandinsky6-pro:v0.5.22-cu130
    container_name: spark-ai-hub-sglang-kandinsky6-pro
    # No published port: the Hub reaches this container by name through its
    # front door at /run/sglang-kandinsky6-pro/.
    networks:
      - spark-ai-hub-net
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    shm_size: 16gb
    command:
      - sglang
      - serve
      - --model-path
      - /models/Kandinsky-6.0-Pro-5s-Diffusers
      - --served-model-name
      - kandinskylab/Kandinsky-6.0-Pro-5s-Diffusers
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      # SGLang offloads the DiT and the text encoder to CPU by default for
      # diffusion models. On the Spark CPU and GPU share the same memory, so
      # offload only adds copies back and forth.
      - --dit-cpu-offload
      - "false"
      - --text-encoder-cpu-offload
      - "false"
      # Pinned host buffers are for fast CPU<->GPU transfer, which unified
      # memory never needs.
      - --pin-cpu-memory
      - "false"
      - --output-path
      - /tmp/sglang-outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
