name: "Ornith-1.5-35B-A3B BF16 DFlash"
version: "1.0.0"
slug: sglang-ornith15-35b-a3b-bf16-dflash
description: "ornith-ai's Ornith-1.5-35B-A3B in BF16, served by SGLang with a genuinely separate DFlash block-diffusion drafter (z-lab/Qwen3.6-35B-A3B-DFlash) instead of the checkpoint's own MTP head. The sibling vLLM recipe serves the NVFP4 build with MTP; SGLang cannot serve that NVFP4 checkpoint at all (its mixed fp8 + NVFP4 weights on this hybrid Gated DeltaNet arch decode to garbage, and DFlash's greedy head cannot read a packed NVFP4 lm_head), so full-precision weights are what makes a real separate drafter possible here. Qwen3.5-family hybrid Gated DeltaNet MoE, reasoning on by default, tool calling live."
