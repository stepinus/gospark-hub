description: "poolside's Laguna-S-2.1 (117.6B-A8.5B MoE, 256 experts) served in native NVFP4 on vLLM 0.25.1 (CUDA-13), following the model card's DGX Spark recipe. Blackwell-native FP4 weights (~71 GB) with an FP8 KV cache and DFlash speculative decoding (poolside/Laguna-S-2.1-DFlash-NVFP4, 15 spec tokens) for agentic coding. Context capped at 65536 — the model's native 262K window needs ~122.5 GiB (weights + draft + KV) against this Spark's ~121 GiB total, so full context does not fit at any gpu-memory-utilization with DFlash active."
