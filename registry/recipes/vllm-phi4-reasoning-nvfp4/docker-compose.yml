services:
  vllm:
    # NVIDIA's NVFP4 (ModelOpt) build of Microsoft's Phi-4-reasoning-plus. The FP8
    # sibling recipe carries the same model at 15.7 GB; this one is 9.7 GB, so the
    # weights stream in Blackwell-native FP4 on the Spark's GB10.
    #
    # Unlike the Qwen3.5-122B NVFP4 checkpoint, this one's fp8 KV declaration IS
    # backed by the weights (40 k_scale + 40 v_scale tensors, one pair per layer),
    # so fp8 KV is calibrated here and `--kv-cache-dtype auto` is the right call --
    # vLLM picks fp8 up from hf_quant_config and uses the shipped scales.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('nvidia/Phi-4-reasoning-plus-NVFP4')"
        FROM vllm/vllm-openai:v0.27.1-aarch64
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/vllm-phi4-reasoning-nvfp4:v0.27.1-aarch64
    container_name: spark-ai-hub-vllm-phi4-reasoning-nvfp4
    networks:
      - spark-ai-hub-net
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    command:
      - --model
      - nvidia/Phi-4-reasoning-plus-NVFP4
      - --port
      - "8000"
      - --quantization
      - modelopt_fp4
      - --max-model-len
      - "32768"
      - --enable-prefix-caching
      - --gpu-memory-utilization
      - "0.25"
      # Phi-4-reasoning wraps its chain of thought in <think>...</think>. vLLM has
      # no Phi-specific parser, but deepseek_r1 is exactly the <think>-tag parser,
      # so the CoT lands in `reasoning` instead of being dumped into `content`.
      - --reasoning-parser
      - deepseek_r1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
