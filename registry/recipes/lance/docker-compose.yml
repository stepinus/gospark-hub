services:
  lance:
    image: ghcr.io/waxacabytes/lance-spark-ai-hub:latest
    container_name: spark-ai-hub-lance
    # No published port: the front-door proxy reaches this container
    # by name on the shared network, so nothing can collide and the
    # whole Hub stays behind one port.
    networks:
      - spark-ai-hub-net
    command:
      - python
      - lance_gradio_t2v_v2t.py
      - --server-name
      - "0.0.0.0"
      - --server-port
      - "7860"
      - --gpus
      - "0"
    environment:
      GRADIO_ROOT_PATH: "/run/lance"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    volumes:
      - lance-tmps:/app/Lance/tmps
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  lance-tmps:

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
