name: "Qwen-Image-2.1 Turbo"
slug: sglang-qwen-image-21-turbo
version: "1.0.0"
description: "Qwen-Image-2.1-Turbo, Qwen's own 8-step accelerated checkpoint of Qwen-Image-2.1: the same 7B DiT, Qwen3-VL 8B text encoder and VAE, sampled on the 8-step schedule shipped with the checkpoint instead of 40 steps, with no classifier-free guidance. Text-to-image, editing with one or several reference images, and transparent (RGBA) output, like the base model. Served by SGLang Diffusion on the OpenAI images API; your coding agents reach it through the Hub's image tools (generate_image / edit_image). Everything stays resident on the GPU at BF16. Qwen Research License (non-commercial)."
author: "Qwen (Alibaba)"
source: "community"
website: "https://huggingface.co/Qwen/Qwen-Image-2.1-Turbo"
upstream: "https://github.com/QwenLM/Qwen-Image-2.1"
category: image-gen
categories:
  - image-gen
tags:
  - openai-images
  - text-to-image
  - image-edit
  - qwen
  - diffusion
  - sglang
  - turbo
  - distilled
icon: "\U0001F5BC️"
logo: "/logos/qwen.png"
requirements:
  min_memory_gb: 48
  recommended_memory_gb: 64
  disk_gb: 60
  cuda_compute: "12.1"
ui:
  # No web page of its own: the Hub's MCP image tools call its API. Proxied so
  # the Hub reaches it at /run/sglang-qwen-image-21-turbo/ with no host port.
  type: api-only
  port: 30000
  proxy: true
  path: "/v1/models"
  health_path: "/health"
docker:
  build: true
  build_time_minutes: 25
  gpu: true
status: experimental
release_date: "2026-10"
engine: "SGLang"
params_b: 7
arch: dense
quantization: "BF16"
weights_gb: 32.5
render_seconds: 8.2
render_workload: "1024x1024, 8 steps"
load_seconds: 132
requires_hf_token: false
# The Hub's image tools use these whenever an agent leaves them unset.
# The checkpoint ships its own 8-step sigma grid and SGLang always runs it, so
# steps 8 only states what happens; CFG 1 (off) is the card's default.
image_defaults:
  steps: 8
  true_cfg_scale: 1.0
  notes: "Always 8 steps on the schedule saved with the checkpoint (a different step count is ignored), CFG 1 (off). Same aspect ratios, editing (1 or more reference images) and transparent output as Qwen-Image-2.1; the card's examples render 2048x2048 edits and 1680x2512 posters."
  source: "https://huggingface.co/Qwen/Qwen-Image-2.1-Turbo"
integration:
  api_url: "<HUB>/v1"
  model_id: "Qwen-Image-2.1-Turbo"
  api_key: "<API_KEY>"
  curl_example: "curl <HUB>/v1/images/generations -H 'Authorization: Bearer <API_KEY>' -H 'Content-Type: application/json' -d '{\"model\": \"Qwen-Image-2.1-Turbo\", \"prompt\": \"A neon shop sign that reads QWEN IMAGE 2.1, rainy night, reflections on wet pavement\", \"size\": \"1024x1024\"}'"
# Human-preference Elo as each board published it on the date read (see
# RecipeArenaScore). base: true = the board lists only the base model.
arena:
  - board: AA-Image-T2I v2.1
    task: text-to-image
    elo: 1029
    entry: Qwen-Image-2.1-Turbo
    votes: 4344
    read: '2026-10-15'
    url: https://artificialanalysis.ai/image/leaderboard/text-to-image
  - board: AA-Image-Editing v2.1
    task: image-editing
    elo: 1064
    entry: Qwen-Image-2.1-Turbo
    votes: 4785
    read: '2026-10-15'
    url: https://artificialanalysis.ai/image/leaderboard/editing
