services:
  sglang:
    # Qwen-Image-2.1-Turbo, Qwen's own 8-step accelerated checkpoint of
    # Qwen-Image-2.1, served by SGLang Diffusion on the OpenAI images API.
    # Same 7B DiT architecture, Qwen3-VL text encoder and VAE as the base
    # model; every file comes from the one Qwen repo.
    #
    # The checkpoint carries its own 8-step sigma grid (sample_sigmas in
    # model_index.json). SGLang reads that grid since #43391 (merged
    # 2026-10-10), so every request runs exactly those 8 steps whatever
    # num_inference_steps says, with CFG off.
    #
    # Image: lmsysorg/sglang:nightly-cu134-20261011-53295c6, pinned by digest --
    # the native aarch64 cu134 nightly line sglang-qwen-image-21 also uses,
    # and the first one carrying #43391; no released tag has it yet. lmsys
    # prunes nightly tags within days; the digest is what is pulled.
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        #
        # Downloaded to a plain directory, not the HF cache: SGLang resolves a
        # repo id through snapshot_download, and offline that refuses a cached
        # snapshot with any file missing. A local path is loaded as-is.
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen-Image-2.1-Turbo', revision='d65dbc9a7e8f6b5479e33dee6030eaab2a906509', local_dir='/models/Qwen-Image-2.1-Turbo', ignore_patterns=['*.jpg', '*.png', '*.webp', 'assets/*'], max_workers=8)"
        FROM lmsysorg/sglang@sha256:3e79541d1e2a6818979c4aa9ca1fa63d6961d7bc50120867953ea6baaf1d8f62
        COPY --from=weights /models /models
    image: spark-ai-hub/sglang-qwen-image-21-turbo:nightly-cu134-20261011
    container_name: spark-ai-hub-sglang-qwen-image-21-turbo
    # No published port: the Hub reaches this container by name through its
    # front door at /run/sglang-qwen-image-21-turbo/, so it never collides
    # with the stock Qwen-Image-2.1 or with any other model.
    networks:
      - spark-ai-hub-net
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    shm_size: 16gb
    command:
      - sglang
      - serve
      - --model-path
      - /models/Qwen-Image-2.1-Turbo
      # SGLang's registry knows the checkpoint by its repo id; the local
      # directory alone would not tell it which pipeline config to use.
      - --model-id
      - Qwen/Qwen-Image-2.1-Turbo
      - --served-model-name
      - Qwen-Image-2.1-Turbo
      - --num-gpus
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      # "Resident": every component stays on the GPU. On this box CPU and GPU
      # share one pool, so an offload would only add copies back and forth.
      - --performance-mode
      - speed
      - --pin-cpu-memory
      - "false"
      # The model returns RGBA, so every request must ask for PNG -- SGLang's
      # disk copy of the result is JPEG by default and dies with "cannot write
      # mode RGBA as JPEG". The Hub's image tools always send
      # output_format=png, so this only bites someone calling the API by hand.
      - --output-path
      - /tmp/sglang-outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
