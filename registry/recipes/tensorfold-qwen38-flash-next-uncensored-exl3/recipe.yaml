name: "Qwen3.8-Flash-Next Uncensored EXL3 4.05bpw"
slug: tensorfold-qwen38-flash-next-uncensored-exl3
version: "1.0.0"
description: "OrcaRouter's abliterated (refusal-removed) Qwen3.8-Flash-Next — the first open-weight release of the architecture behind Qwen4, 177B total parameters over a hybrid linear/full attention stack — served by TensorFold from Lygodactylus's EXL3 pack: 4.05 bits a weight, the head at 6, the MTP layer at 8, the n-gram tables at 6 and the vision tower left at 16 bits, the most accurate uncensored Flash-Next TensorFold reads. The 36.4 GiB PLE n-gram table is memory-mapped and only the rows a prompt needs are read. Five requests decode together at the full native 262K context each, over a 1.3M-token int8 KV pool. Decoding drafts up to six MTP tokens a round, plus prompt-lookup drafts when the reply repeats the prompt; every draft is verified by the model, so output is the abliterated model's own. Images and videos work as OpenAI image_url / video_url parts (data URLs), as do tool calling with typed parameters and reasoning. Removes safety refusals the upstream model was trained to have; supply your own guardrails. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
