services:
  atlas:
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        # Xet MUST stay enabled here: model-00001-of-00002.safetensors is 50.01GB,
        # just over huggingface_hub's plain-HTTP ceiling
        # (constants.MAX_HTTP_DOWNLOAD_SIZE = 50GB), which it refuses outright.
        # The shard is xet-backed on the Hub, so hf_xet is the working transport.
        ENV HF_HOME=/weights
        RUN pip install --no-cache-dir "huggingface_hub[hf_xet]"
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('RedHatAI/Qwen3.5-122B-A10B-NVFP4')"
        FROM avarok/atlas-gb10:latest
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/atlas-qwen35-122b-a10b-nvfp4:latest
    container_name: spark-ai-hub-atlas-qwen35-122b-a10b-nvfp4
    networks:
      - spark-ai-hub-net
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    command:
      - serve
      - RedHatAI/Qwen3.5-122B-A10B-NVFP4
      - --bind
      - 0.0.0.0
      - --port
      - "8888"
      - --max-seq-len
      - "262144"
      - --max-batch-size
      - "1"
      - --kv-cache-dtype
      - nvfp4
      - --gpu-memory-utilization
      - "0.98"
      - --scheduling-policy
      - slai
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
