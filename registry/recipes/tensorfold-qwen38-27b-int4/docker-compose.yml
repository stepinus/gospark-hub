services:
  tensorfold:
    # Qwen3.8-27B served by TensorFold from TensorFold's own MLX 4-bit
    # checkpoint (affine, groups of 64, vision tower unquantized), drafting
    # with z-lab's DFlash2. Mia's AI Lab single-Spark recipe, as
    # `tensorfold serve` flags and TENSORFOLD_* variables:
    #   https://github.com/MiaAI-Lab/Qwen3.8-27B-DGX-Spark-TensorFold
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        # --- weights stage ---------------------------------------------------
        # Model and drafter weights are part of the app artifact: baked into
        # the final image below, so `docker rmi` reclaims every byte this
        # recipe added. Both pinned to the revisions measured.
        FROM python:3.12-slim AS weights
        ENV HF_HUB_DISABLE_XET=1 HF_HUB_DOWNLOAD_TIMEOUT=60
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('TensorFold/Qwen3.8-27B-MLX-4bit', revision='22d8d538154e0e5b6f8dcb1fcc74a60a0798104c', local_dir='/weights/model', ignore_patterns=['.gitattributes', '*.png'], max_workers=8)"
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('z-lab/Qwen3.8-27B-DFlash2', revision='50307d4c4cde6860d4eee73e2547cd786fe8e8a4', local_dir='/weights/drafter', ignore_patterns=['.gitattributes'])"

        # --- runtime stage ---------------------------------------------------
        # TensorFold v0.6.0 with Mia's five 27B patches (many images and
        # video, YaRN, FP8 KV cache, memory reserve, pinned KV pool) on
        # NVIDIA's nvcr.io/nvidia/pytorch:26.07-py3 (arm64, CUDA 13), as
        # published by Mia's AI Lab and pinned by digest (tag
        # v0.6.0-fb91a0019fdc). TensorFold itself publishes no image.
        FROM ghcr.io/miaai-lab/qwen3.8-27b-dgx-spark-tensorfold@sha256:043d192b9e1725f55c5439fc9672055de891433e5b31448ed8963918e3c460e9
        # TensorFold compiles its CUDA extensions on first use into
        # TORCH_EXTENSIONS_DIR. Compiled here instead, for GB10 (sm_121) only,
        # so they ship inside the image and launch compiles nothing. No GPU is
        # needed to compile: the capability TensorFold asks the driver for is
        # stated instead.
        ENV TORCH_EXTENSIONS_DIR=/opt/tensorfold/torch_extensions \
            TRITON_CACHE_DIR=/tmp/triton \
            TORCH_CUDA_ARCH_LIST=12.1
        RUN <<'PY' python3
        import importlib, pkgutil, torch, tensorfold
        torch.cuda.get_device_capability = lambda *a: (12, 1)
        for m in pkgutil.walk_packages(tensorfold.__path__, "tensorfold."):
            if any(k in m.name for k in ("mlx", "metal", "__main__")):
                continue
            try:
                mod = importlib.import_module(m.name)
            except BaseException:
                continue
            ext = getattr(mod, "_ext", None)
            if callable(ext) and getattr(ext, "__module__", "") == m.name:
                ext()
                print("built", m.name, flush=True)
        PY
        COPY --from=weights /weights/model /models/Qwen3.8-27B-MLX-4bit
        COPY --from=weights /weights/drafter /models/Qwen3.8-27B-DFlash2
    image: spark-ai-hub/tensorfold-qwen38-27b-int4:tf-v0.6.0-22d8d53
    container_name: spark-ai-hub-tensorfold-qwen38-27b-int4
    networks:
      - spark-ai-hub-net
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      # Offline-first: model and drafter are in the image and are served from
      # directory paths, so nothing is resolved against the Hub.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      # No "is there a newer TensorFold" call to GitHub at each start.
      - TENSORFOLD_NO_UPDATE_CHECK=1
      # FP8 (e4m3) attention cache (patch 0003): 32 KiB a token instead of
      # 64, so twice the tokens fit; drafted replies still equal serial ones.
      - TENSORFOLD_KV_DTYPE=fp8
      # Pinned KV pool (patch 0005): 78 GiB of attention cache reserved at
      # startup (~2.5M FP8 tokens, eight full 262K windows), shared by every
      # stream and never given back; the server holds ~97 GiB from the first
      # second. Mia's KV_POOL_GB=auto gives 78 on a Spark with ~109 GiB free.
      - TENSORFOLD_KV_POOL_GIB=78
      # Startup reserve left out of MemAvailable (patch 0004): 0, the whole of
      # MemAvailable is the budget.
      - TENSORFOLD_MEMORY_RESERVE_GIB=0
      # Up to 50 images a request sharing 16,384 visual tokens, and a
      # 16,384-token video budget (patch 0001).
      - TENSORFOLD_MAX_IMAGES=50
      - TENSORFOLD_IMAGE_TOKENS=16384
      - TENSORFOLD_VIDEO_TOKENS=16384
      - PYTHONUNBUFFERED=1
    # The image's entrypoint (NVIDIA's banner) runs this command.
    command:
      - tensorfold
      - serve
      - /models/Qwen3.8-27B-MLX-4bit
      - --host
      - "0.0.0.0"
      - --port
      - "8888"
      - --name
      - TensorFold/Qwen3.8-27B-MLX-4bit
      # DFlash2 drafts, the target verifies every token: output equals the
      # serial decode.
      - --drafter
      - /models/Qwen3.8-27B-DFlash2
      # Eight requests decoded together, each with the model's native
      # 262,144-token window. A single request decodes as fast as alone.
      - --parallel
      - "8"
      - --context
      - "262144"
      # FP8 prompt activations: ~35-40% faster prefill (TensorFold's own
      # default since 0.6.0 is bf16); decode is unaffected.
      - --prefill-fp8
      # Qwen's thinking-mode sampling; a request's own values win.
      - --temperature
      - "1.0"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --thinking
      # Image and video input (data URLs; add --vision-urls to fetch
      # https:// URLs), through the checkpoint's own vision tower.
      - --vision
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # NOT unless-stopped: a boot that fails must stop instead of looping.
    restart: on-failure:1

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
