name: "Qwen3.8-27B INT4 DFlash2"
slug: tensorfold-qwen38-27b-int4
version: "1.0.0"
description: "Qwen3.8-27B from TensorFold's own MLX 4-bit checkpoint (affine INT4, groups of 64, vision tower unquantized), served by TensorFold v0.6.0 with Mia's AI Lab single-Spark patches, drafting with z-lab's DFlash2. Every drafted reply equals the serial decode. Eight requests decode together (a lone request runs as fast as alone), each with the native 262K window, over an FP8 KV cache that fits twice the tokens; prompts fill in FP8. Up to 50 images and video per request as OpenAI image_url / video parts (data URLs). Thinking on by default, tool calling and reasoning live. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
author: "Alibaba Cloud + TensorFold + z-lab + Mia's AI Lab"
source: "community"
website: "https://mia-ai.net/models/Qwen3.8-27B-DGX-Spark-TensorFold"
