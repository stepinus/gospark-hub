name: "DeepSeek-V4-Flash-0731 (EXL3 3.0bpw)"
slug: vllm-deepseek-v4-flash-exl3
version: "1.0.0"
description: "DeepSeek-V4-Flash-0731 284B MoE (13B active) as EXL3/Trellis 3.0 bpw on a single DGX Spark, served by the SparkInfer vLLM fork with DSpark K5 speculative decoding and an NVFP4 compressed KV cache. EXL3 is a QTIP-style trellis format with per-tensor importance weighting, so 3.0 bpw lands near GGUF Q4_K_M-Q5_K quality rather than the Q2/Q3 territory a same-size GGUF gives; the checkpoint is REAP-pruned to 216 of 256 experts, with attention, embeddings, head, mHC and indexer kept at FP8/BF16. Deep context: a single 256K-token request. Thinking on with effort max by default, tool calling live."
