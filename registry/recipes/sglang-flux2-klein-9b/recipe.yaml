name: "FLUX.2 [klein] 9B"
slug: sglang-flux2-klein-9b
version: "1.0.0"
description: "Generate and edit images with Black Forest Labs' FLUX.2 [klein] 9B, one step-distilled model for text-to-image and multi-reference editing, served by SGLang Diffusion on the OpenAI images API. Your coding agents reach it through the Hub's image tools (generate_image / edit_image). Non-commercial license."
author: "Black Forest Labs"
source: "community"
website: "https://huggingface.co/black-forest-labs/FLUX.2-klein-9B"
upstream: "https://bfl.ai/blog/flux2-klein-towards-interactive-visual-intelligence"
category: image-gen
categories:
  - image-gen
tags:
  - openai-images
  - text-to-image
  - image-edit
  - multi-image
  - flux
  - diffusion
  - sglang
  - bf16
icon: "\U0001F5BC️"
logo: "/logos/bfl.png"
requirements:
  min_memory_gb: 40
  recommended_memory_gb: 48
  disk_gb: 80
  cuda_compute: "12.1"
ui:
  # No web page of its own: the Hub's MCP image tools call its API. Proxied so
  # the Hub reaches it at /run/sglang-flux2-klein-9b/ with no host port.
  type: api-only
  port: 30000
  proxy: true
  path: "/v1/models"
  health_path: "/health"
docker:
  build: true
  build_time_minutes: 20
  gpu: true
status: experimental
release_date: "2026-01"
engine: "SGLang"
params_b: 9
arch: dense
quantization: "BF16"
weights_gb: 34.7
render_seconds: 5.2
render_workload: "1024x1024, 4 steps"
load_seconds: 125
requires_hf_token: true
# From the model card's example; the Hub's image tools use these whenever an
# agent leaves them unset.
image_defaults:
  steps: 4
  guidance_scale: 1.0
  notes: "Step-distilled to 4 inference steps; more steps add time, not quality."
  source: "https://huggingface.co/black-forest-labs/FLUX.2-klein-9B"

# Human-preference Elo as each board published it on the date read (see
# RecipeArenaScore). base: true = the board lists only the base model.
arena:
  - board: AA-Image-T2I v2.1
    task: text-to-image
    elo: 931
    entry: FLUX.2 [klein] 9B
    votes: 10471
    read: '2026-10-15'
    url: https://artificialanalysis.ai/image/leaderboard/text-to-image
  - board: AA-Image-Editing v2.1
    task: image-editing
    elo: 1015
    entry: FLUX.2 [klein] 9B
    votes: 6936
    read: '2026-10-15'
    url: https://artificialanalysis.ai/image/leaderboard/editing

cover:
  image: scene-flux2-klein.jpg
  caption: "A lone easel in a misty Black Forest clearing at blue hour — Black Forest Labs is from Freiburg. Generated by FLUX.2 [klein] 9B itself on the Spark."
  grade: false
  credit: "Generated with FLUX.2 [klein] 9B · FLUX Non-Commercial License"
  source: "https://huggingface.co/black-forest-labs/FLUX.2-klein-9B"
# FLUX Non-Commercial License: the token's account must accept it on the web.
gated_repos:
  - "black-forest-labs/FLUX.2-klein-9B"
