services:
  vllm:
    # poolside/Laguna-XS-2.1-NVFP4 is a `LagunaForCausalLM` (model_type: laguna)
    # 33B-A3B MoE (256 experts + 1 shared), 40 layers in a 3:1 SWA(512) : global
    # attention layout with per-head sigmoid gating. NVFP4 weights (~21.6 GB) with
    # a baked-in FP8 KV cache.
    #
    # Image pinning, per the model card's requirements:
    #   * "vLLM >= 0.21.0" for the laguna arch (vllm#41129)
    #   * "vLLM >= 0.22.0" for the FP8 KV cache on non-Hopper GPUs (vllm#42650) —
    #     without it GB10 produces scrambled output
    #   * vllm#47311 for the `poolside_v1` tool parser (merged 2026-07-02, first
    #     shipped in v0.25.0); on older builds the card says to fall back to
    #     `--tool-call-parser glm47`
    #   * vllm#46853 for the DFlash drafter (merged 2026-07-03, ships in v0.25.0+)
    # v0.25.1 satisfies all four. The plain `-aarch64` tag is the cu130/CUDA-13
    # build, matching the Spark's CUDA 13 driver.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        ENV HF_HUB_DISABLE_XET=1 HF_HOME=/weights
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('poolside/Laguna-XS-2.1-NVFP4'); snapshot_download('poolside/Laguna-XS-2.1-DFlash-NVFP4')"
        FROM vllm/vllm-openai:v0.25.1-aarch64
        COPY --from=weights /weights /root/.cache/huggingface
    image: spark-ai-hub/vllm-laguna-xs-21-nvfp4:v0.25.1-aarch64
    container_name: spark-ai-hub-vllm-laguna-xs-21-nvfp4
    networks:
      - spark-ai-hub-net
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      # Offline-first: install prefetches both the NVFP4 weights and the DFlash
      # drafter into the cache volume, so launch never touches the network.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    # poolside's vLLM recipe for Laguna XS 2.1, with `-NVFP4` substituted for the
    # model id as the card instructs ("Quantization is detected automatically from
    # quantization_config in this checkpoint, so the same command works ...
    # No extra flags required") — hence no --quantization / --kv-cache-dtype here.
    command:
      - --model
      - poolside/Laguna-XS-2.1-NVFP4
      - --port
      - "8000"
      - --trust-remote-code
      - --max-model-len
      - "262144"
      # Speculative decoding with the DFlash drafter (5-layer, ~0.9 GB NVFP4),
      # per the "Optional: speculative decoding with DFlash" note on the card.
      - --speculative-config
      - '{"model":"poolside/Laguna-XS-2.1-DFlash-NVFP4","num_speculative_tokens":15,"method":"dflash"}'
      # DFlash drafts in parallel, so vLLM reserves `num_speculative_tokens`
      # extra batch slots per request (15 x max_num_seqs). With vLLM's defaults
      # that reservation exceeds max_num_batched_tokens and the engine refuses to
      # start ("max_num_scheduled_tokens is set to -1536"). Sizing both explicitly
      # leaves ~15.9K schedulable tokens per step — above vLLM's 8192 warning
      # threshold — while 32 concurrent sequences is well beyond what a single
      # Spark needs. poolside's own DGX Spark recipe for the sibling Laguna-S
      # pins --max-num-seqs 32 for the same reason.
      - --max-num-seqs
      - "32"
      - --max-num-batched-tokens
      - "16384"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - poolside_v1
      - --reasoning-parser
      - poolside_v1
      # Native interleaved thinking on by default, as in the card's serve command.
      - --default-chat-template-kwargs
      - '{"enable_thinking": true}'
      # Right-sized for the Spark: ~21.6 GB weights + ~0.9 GB drafter, and only the
      # 10 global-attention layers hold a full-length KV (the 30 SWA layers cap at
      # 512 tokens), so 262144 tokens costs ~5.4 GB of FP8 KV per sequence.
      - --gpu-memory-utilization
      - "0.35"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
