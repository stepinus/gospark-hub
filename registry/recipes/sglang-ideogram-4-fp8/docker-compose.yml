services:
  sglang:
    # Ideogram 4 (9.3B) in Ideogram's own FP8 release, served by SGLang
    # Diffusion on the OpenAI images API: POST /v1/images/generations.
    # Text-to-image only. Steps and guidance come from a named sampler preset
    # (V4_DEFAULT_20, V4_QUALITY_48, V4_TURBO_12, ...) that the request names;
    # SGLang refuses steps or guidance set directly for this model.
    #
    # Image: lmsysorg/sglang:v0.5.19-cu130 -- a stable numbered release (not a
    # rolling dev/nightly tag), arm64 manifest present, and Ideogram 4 is in its
    # diffusion registry.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        FROM python:3.13-slim AS weights
        # Model weights are part of the app artifact: they are baked into the
        # image below, so `docker rmi` reclaims every byte this recipe added.
        #
        # Downloaded to a plain directory, not the HF cache: SGLang resolves a
        # repo id through snapshot_download, and offline that refuses a cached
        # snapshot with any file missing. A local path is loaded as-is.
        ENV HF_HUB_DISABLE_XET=1
        RUN pip install --no-cache-dir huggingface_hub
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('ideogram-ai/ideogram-4-fp8', local_dir='/models/ideogram-4-fp8', ignore_patterns=['*.jpg', '*.png', '*.svg', 'assets/*'])"
        FROM lmsysorg/sglang:v0.5.19-cu130
        COPY --from=weights /models /models
    image: spark-ai-hub/sglang-ideogram-4-fp8:v0.5.19-cu130
    container_name: spark-ai-hub-sglang-ideogram-4-fp8
    # No published port: the Hub reaches this container by name through its
    # front door at /run/sglang-ideogram-4-fp8/, so it never collides with the
    # LLM or with another image model.
    networks:
      - spark-ai-hub-net
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
    ipc: host
    shm_size: 16gb
    command:
      - sglang
      - serve
      # The directory name contains "ideogram-4-fp8", which is what SGLang's
      # diffusion registry matches to pick the Ideogram 4 pipeline.
      - --model-path
      - /models/ideogram-4-fp8
      - --served-model-name
      - ideogram-ai/ideogram-4-fp8
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      # SGLang offloads the DiT and the text encoder to CPU by default for
      # image models, whatever the GPU size. On the Spark CPU and GPU share
      # the same memory, so offload only adds copies back and forth.
      - --dit-cpu-offload
      - "false"
      - --text-encoder-cpu-offload
      - "false"
      # Pinned host buffers are only for fast CPU<->GPU transfer, which
      # unified memory never needs; pinning would lock memory for nothing.
      - --pin-cpu-memory
      - "false"
      - --output-path
      - /tmp/sglang-outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
