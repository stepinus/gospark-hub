name: "Qwen3.6-35B-A3B MoE INT4 MTP"
slug: tensorfold-qwen36-35b-a3b-int4-mtp
version: "1.0.0"
description: "Qwen3.6-35B-A3B — 35B total parameters, 3B active, Gated DeltaNet and gated full attention with 256 routed experts — served by TensorFold, an inference engine whose CUDA kernels were written for this model family, following upstream's recipe. The checkpoint is TensorFold's own MLX 4-bit build (affine INT4, groups of 64, routers at 8 bits) with the model's native MTP layer kept, which mlx-community's conversion drops. Decoding drafts up to three MTP tokens a round, plus copied continuations when the reply repeats the context; every draft is verified by the model, so output equals serial decoding. Eight requests decode together and a lone request runs as fast as alone, each with up to the native 262K window. Prompts fill in FP8. Tool calling and reasoning work as usual. It is a reasoning model — the chain-of-thought arrives in reasoning_content, so allow a few hundred max_tokens or the visible answer comes back empty."
author: "Alibaba Cloud + TensorFold"
source: "community"
website: "https://huggingface.co/TensorFold/Qwen3.6-35B-A3B-MLX-4bit-MTP"
