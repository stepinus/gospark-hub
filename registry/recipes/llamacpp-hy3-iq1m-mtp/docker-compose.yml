services:
  llama-server:
    # Mainline llama.cpp with hy_v3 (Hunyuan v3) support (merged upstream via
    # https://github.com/ggml-org/llama.cpp/pull/25395, 2026-07-13), built native
    # for the DGX Spark (ARM64 + CUDA 13, GB10 sm_121).
    # Source: https://github.com/WaxacaBytes/hy3-llamacpp-spark-ai-hub
    image: ghcr.io/waxacabytes/hy3-llamacpp-spark-ai-hub:latest
    # Built locally at install time (no registry ships a prebuilt aarch64+CUDA13
    # llama.cpp). Layers are compiled once and cached; relaunch is offline.
    build:
      context: .
      secrets:
        - hf_token
      dockerfile_inline: |
        # --- weights stage ---------------------------------------------------
        # Model weights are part of the app artifact: baked into the final image
        # below, so `docker rmi` reclaims every byte this recipe introduced.
        FROM python:3.13-slim AS weights
        # Xet MUST stay enabled here: Hy3-IQ1_M.gguf is a single 91.8GB file and
        # huggingface_hub refuses any plain-HTTP download over 50GB
        # (constants.MAX_HTTP_DOWNLOAD_SIZE). The file is xet-backed on the Hub, so
        # hf_xet is both the only working transport and the fast one.
        ENV HF_HOME=/weights
        RUN pip install --no-cache-dir "huggingface_hub[hf_xet]"
        RUN --mount=type=secret,id=hf_token \
            HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" \
            python3 -c "from huggingface_hub import snapshot_download; snapshot_download('AtomicChat/Hy3-GGUF', allow_patterns=['*Hy3-IQ1_M.gguf*'])"
        # ---------------------------------------------------------------------

        # hy3-llamacpp-spark-ai-hub — mainline llama.cpp with hy_v3 (Hunyuan v3) support
        #
        # hy_v3 is now IN mainline llama.cpp (merged via PR #25395 on 2026-07-13). An
        # earlier version of this recipe built a pinned pre-merge commit plus two
        # AngelSlim-authored patches; AngelSlim have since deleted those patches and
        # re-quantized their GGUFs to the new mainline tensor layout, which broke the
        # old patched build (crashed with "wrong number of tensors"). No patches are
        # needed anymore — this just builds a recent mainline commit.
        #
        # Weights source: AtomicChat/Hy3-GGUF (self-quantized from tencent/Hy3, not a
        # repack of AngelSlim's files). Its IQ1_M file includes an MTP head
        # (blk.80.nextn.* tensors) even though AtomicChat's README doesn't advertise
        # MTP separately — verified 2026-08-19: self-speculative decoding engages
        # (26-42% draft acceptance) and measures 13.74 tok/s, matching this recipe's
        # original AngelSlim-sourced MTP variant (14.0 tok/s, spec/never benchmarked
        # before the source broke). AngelSlim's own MTP file remains unusable until
        # someone rebuilds a from-scratch recipe against their patches (defunct) or
        # confirms their file also now matches mainline.

        # ── Stage 1: build ───────────────────────────────────────────────────────────
        FROM nvcr.io/nvidia/cuda:13.0.1-devel-ubuntu24.04 AS build

        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update && apt-get install -y --no-install-recommends \
                git cmake ninja-build build-essential \
                libcurl4-openssl-dev ca-certificates \
            && rm -rf /var/lib/apt/lists/*

        # Pinned to a recent mainline commit (post hy_v3 merge). Bump deliberately,
        # not casually -- re-verify the model still loads and produces coherent output.
        ARG LLAMA_COMMIT=947fd9bb2bdeaa72e9dd74b6aa3b5d68f03f3d6a
        ARG CUDA_ARCH=121

        WORKDIR /src
        RUN git clone https://github.com/ggml-org/llama.cpp.git . \
            && git checkout -q $${LLAMA_COMMIT}

        # Build server + cli with CUDA (GB10 = sm_121), curl for -hf cache resolution.
        # Static ggml (default) so the CUDA driver stub links into the binaries; shared
        # libs leave libggml-cuda.so with undefined cuMem* driver symbols on aarch64.
        # Add the sbsa driver-stub search path so -lcuda resolves at link time (the real
        # libcuda.so.1 is provided by the NVIDIA runtime at container start).
        RUN cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DGGML_CUDA=ON \
                -DCMAKE_CUDA_ARCHITECTURES=$${CUDA_ARCH} \
                -DLLAMA_BUILD_SERVER=ON \
                -DLLAMA_CURL=ON \
                -DLLAMA_OPENSSL=OFF \
                -DCMAKE_EXE_LINKER_FLAGS="-L/usr/local/cuda-13.0/targets/sbsa-linux/lib/stubs -lcuda" \
                -DCMAKE_SHARED_LINKER_FLAGS="-L/usr/local/cuda-13.0/targets/sbsa-linux/lib/stubs -lcuda" \
            && cmake --build build --config Release -j "$(nproc)" \
                --target llama-server llama-cli llama-quantize \
            # Copy the built binaries + their shared libs (llama.cpp emits both into
            # build/bin) directly; `cmake --install` would try to install unbuilt tests.
            && mkdir -p /opt/llama/bin \
            && cp -a build/bin/. /opt/llama/bin/

        # ── Stage 2: runtime ─────────────────────────────────────────────────────────
        FROM nvcr.io/nvidia/cuda:13.0.1-runtime-ubuntu24.04

        ENV DEBIAN_FRONTEND=noninteractive
        # python3 + huggingface_hub are required so the Hub's install-time prefetch
        # (runs `python3 -c "...snapshot_download..."` inside this image) can cache the
        # GGUF weights. hf_xet accelerates the large (~92GB) download.
        RUN apt-get update && apt-get install -y --no-install-recommends \
                libcurl4 libgomp1 ca-certificates \
                python3 python3-pip \
            && pip install --no-cache-dir --break-system-packages "huggingface_hub[hf_xet]" \
            && rm -rf /var/lib/apt/lists/*

        COPY --from=build /opt/llama /opt/llama
        # NOTE: the chat template is NOT baked into the image. It is passed as an inline
        # --chat-template value in docker-compose.yml so the full template (and the
        # reasoning_effort default) is visible and editable in the Hub's compose editor.

        ENV PATH="/opt/llama/bin:$${PATH}" \
            LD_LIBRARY_PATH="/opt/llama/bin:$${LD_LIBRARY_PATH}"

        EXPOSE 8080
        ENTRYPOINT ["/opt/llama/bin/llama-server"]

        COPY --from=weights /weights /root/.cache/huggingface
    container_name: spark-ai-hub-llamacpp-hy3-iq1m-mtp
    command:
      - -hf
      - AtomicChat/Hy3-GGUF
      - --hf-file
      - Hy3-IQ1_M.gguf
      - --alias
      - hy3
      - -ngl
      - "999"
      - -c
      - "65536"
      # MTP self-speculative decoding (uses the model's own next-token head).
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "3"
      - --spec-draft-n-min
      - "1"
      # Quantize both main and draft KV caches to q8_0 to fit 65K in 128GB unified.
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - -ctkd
      - q8_0
      - -ctvd
      - q8_0
      - -fa
      - "on"
      # minja-compatible chat template baked into the image (built-in one uses
      # Python str.format which llama.cpp's minja engine cannot evaluate).
      - --jinja
      # Chat template inlined here so the FULL model behavior (incl. the
      # reasoning_effort default below) is visible and editable in the Hub's compose
      # editor -- nothing baked opaquely into the image. This is tencent/Hy3's
      # upstream chat_template.jinja with its handful of .format() calls flattened
      # to literal strings (llama.cpp's minja engine can't evaluate str.format;
      # everything else is unmodified).
      - --chat-template
      - |
        {#- ----------‑‑‑ special token variables (minja-compatible: literal :opensource suffix, .format() stripped) ‑‑‑---------- -#}
        {%- set eos_token = '<｜hy_eos:opensource｜>' %}
        {%- set bos_token = '<｜hy_begin_of_sentence:opensource｜>' %}
        {%- set pad_token = '<｜hy_pad:opensource｜>' %}
        {%- set user_token = '<｜hy_User:opensource｜>' %}
        {%- set assistant_token = '<｜hy_Assistant:opensource｜>' %}
        {%- set think_begin_token = '<think:opensource>' %}
        {%- set think_end_token = '</think:opensource>' %}
        {%- set toolcalls_begin_token = '<tool_calls:opensource>' %}
        {%- set toolcalls_end_token = '</tool_calls:opensource>' %}
        {%- set toolcall_begin_token = '<tool_call:opensource>' %}
        {%- set toolcall_end_token = '</tool_call:opensource>' %}
        {%- set toolsep_token = '<tool_sep:opensource>' %}
        {%- set argkey_begin_token = '<arg_key:opensource>' %}
        {%- set argkey_end_token = '</arg_key:opensource>' %}
        {%- set argvalue_begin_token = '<arg_value:opensource>' %}
        {%- set argvalue_end_token = '</arg_value:opensource>' %}
        {%- set toolresponses_begin_token = '<tool_responses:opensource>' %}
        {%- set toolresponses_end_token = '</tool_responses:opensource>' %}
        {%- set toolresponse_begin_token = '<tool_response:opensource>' %}
        {%- set toolresponse_end_token = '</tool_response:opensource>' %}
        {%- set reasoning_mode_token = '<｜reasoning_mode:opensource｜>' %}

        {#- ----------‑‑‑ hyperparameters variables ‑‑‑---------- -#}
        {%- if not add_generation_prompt is defined %}
            {%- set add_generation_prompt = false %}
        {%- endif %}
        {%- if not preserved_thinking is defined %}
            {%- if not tools %}
                {%- set preserved_thinking = false %}
            {%- else %}
                {%- set preserved_thinking = true %}
            {%- endif %}
        {%- endif %}
        {%- if not is_training is defined %}
            {%- set is_training = false %}
        {%- endif %}

        {%- if not reasoning_effort is defined %}
            {%- set reasoning_effort = 'no_think' %}
        {%- elif reasoning_effort not in ['high', 'low', 'no_think'] %}
            {%- if reasoning_effort is none %}
                {{- raise_exception('reasoning_effort error : None, should be no_think/low/high') }}
            {%- else %}
                {{- raise_exception('reasoning_effort error : ' + reasoning_effort + ', should be no_think/low/high') }}
            {%- endif %}
        {%- endif %}

        {%- if fallback_strategy is defined and fallback_strategy == 'reasoning_toolcall_retry' %}
            {%- set reasoning_effort = 'high' %}
            {%- set add_generation_prompt = false %}
        {%- endif %}
        {%- if not raw_last_assistant is defined %}
            {%- set raw_last_assistant = false %}
        {%- endif %}

        {%- macro visible_text(content) -%}
            {%- if content is string -%}
                {{- content }}
            {%- elif content is iterable and content is not mapping -%}
                {%- for item in content -%}
                    {%- if item is mapping and item.type == 'text' -%}
                        {{- item.text }}
                    {%- elif item is string -%}
                        {{- item }}
                    {%- endif -%}
                {%- endfor -%}
            {%- elif content is none -%}
                {{- '' }}
            {%- else -%}
                {{- content }}
            {%- endif -%}
        {%- endmacro -%}

        {%- set ns = namespace(last_user_index=-1) %}
        {%- set sp_ns = namespace(system_prompt='', is_first_sp=true) %}
        {%- for message in messages %}
            {%- if message['role'] == 'system' %}
                {%- set sp_ns.system_prompt = sp_ns.system_prompt + visible_text(message['content']) %}
            {%- endif %}
            {%- if message['role'] == 'user' %}
                {%- set ns.last_user_index = loop.index0 %}
            {%- endif %}
        {%- endfor %}
        {%- if reasoning_effort is defined and reasoning_effort is string and reasoning_effort != '' and not tools %}
            {%- set sp_ns.system_prompt = sp_ns.system_prompt + reasoning_mode_token + 'reasoning_effort:' + reasoning_effort %}
        {%- endif %}
        {{- bos_token }}
        {{- sp_ns.system_prompt }}
        {%- if tools %}
            {%- if sp_ns.system_prompt != '' %}
                {{- '\n\n# Tools\n\nYou may call one or more functions to assist with the user query.' }}
            {%- else %}
                {{- '# Tools\n\nYou may call one or more functions to assist with the user query.' }}
            {%- endif %}
            {{- '\n\nYou are provided with function signatures within <tools></tools> XML tags:' }}
            {{- '\n<tools>\n' }}
            {%- for tool in tools %}
                {%- if loop.index0 > 0 %}
                    {{- '\n' }}
                {%- endif %}
                {{- tool | tojson }}
            {%- endfor %}
            {{- '\n</tools>\n\n' }}
            {{- 'For function call returns, you should first print ' + toolcalls_begin_token + '\n' }}
            {{- 'For each function call, you should return object like:\n' }}
            {{- toolcall_begin_token + '{function-name}' + toolsep_token + '\n' }}
            {{- argkey_begin_token + '{arg-key-1}' + argkey_end_token + '\n' }}
            {{- argvalue_begin_token + '{arg-value-1}' + argvalue_end_token + '\n' }}
            {{- argkey_begin_token + '{arg-key-2}' + argkey_end_token + '\n' }}
            {{- argvalue_begin_token + '{arg-value-2}' + argvalue_end_token + '\n' }}
            {{- '...\n' }}
            {{- toolcall_end_token + '\n' }}
            {%- if reasoning_effort is defined and reasoning_effort is string and reasoning_effort != '' %}
                {{- 'At the end of function call returns, you should print ' + toolcalls_end_token + reasoning_mode_token + 'reasoning_effort:' + reasoning_effort }}
            {%- else %}
                {{- 'At the end of function call returns, you should print ' + toolcalls_end_token }}
            {%- endif %}
        {%- endif %}

        {%- set prev_ns = namespace(is_tool=false, is_tool_first=true) %}
        {%- set last_ns = namespace(last_is_assistant=false) %}
        {%- for message in messages %}
            {%- if message['role'] == 'user' %}
                {%- if prev_ns.is_tool %}
                    {{- toolresponses_end_token }}
                {%- endif %}
                {{- user_token + visible_text(message['content']) }}
                {%- set prev_ns.is_tool = false %}
            {%- endif %}
            {%- if message['role'] == 'assistant' %}
                {%- if is_training %}
                    {%- if 'reasoning_content' in message and message['reasoning_content'] is string %}
                        {%- set rc = message['reasoning_content'] %}
                    {%- elif 'reasoning' in message and message['reasoning'] is string %}
                        {%- set rc = message['reasoning'] %}
                    {%- else %}
                        {%- set rc = none %}
                    {%- endif %}
                    {%- if rc is not none %}
                        {%- set content = think_begin_token + rc + think_end_token + visible_text(message['content']) %}
                    {%- else %}
                        {%- set content = think_begin_token + think_end_token + visible_text(message['content']) %}
                    {%- endif %}
                {%- else %}
                    {%- if ((preserved_thinking is defined and preserved_thinking) or loop.index0 > ns.last_user_index) %}
                        {%- if 'reasoning_content' in message and message['reasoning_content'] is string %}
                            {%- set rc = message['reasoning_content'] %}
                        {%- elif 'reasoning' in message and message['reasoning'] is string %}
                            {%- set rc = message['reasoning'] %}
                        {%- else %}
                            {%- set rc = none %}
                        {%- endif %}
                        {%- if rc is not none %}
                            {%- set content = think_begin_token + rc + think_end_token + visible_text(message['content']) %}
                        {%- else %}
                            {%- set content = think_begin_token + think_end_token + visible_text(message['content']) %}
                        {%- endif %}
                    {%- else %}
                        {%- set content = think_begin_token + think_end_token + visible_text(message['content']) %}
                    {%- endif %}
                {%- endif %}
                {%- if prev_ns.is_tool %}
                    {{- toolresponses_end_token }}
                {%- endif %}
                {{- assistant_token }}
                {%- if message['tool_calls'] is defined and message['tool_calls'] %}
                    {%- set prev_ns.is_tool_first = true %}
                    {{- content }}
                    {{- toolcalls_begin_token + '\n' }}
                    {%- for tool in message['tool_calls'] %}
                        {%- set arguments = tool['function']['arguments'] %}
                        {{- toolcall_begin_token + tool['function']['name'] + toolsep_token + '\n' }}
                        {%- for key, value in arguments.items() %}
                            {{- argkey_begin_token + key + argkey_end_token + '\n' }}
                            {%- if value is not string %}
                                {%- set value = value | tojson(ensure_ascii=False) %}
                            {%- endif %}
                            {{- argvalue_begin_token + value + argvalue_end_token + '\n' }}
                        {%- endfor %}
                        {{- toolcall_end_token + '\n' }}
                    {%- endfor %}
                    {{- toolcalls_end_token + eos_token }}
                {%- else %}
                    {%- if loop.last and raw_last_assistant %}
                        {{- visible_text(message['content']) }}
                    {%- elif not loop.last or is_training %}
                        {{- content + eos_token }}
                    {%- else %}
                        {{- content }}
                    {%- endif %}
                {%- endif %}
                {%- set prev_ns.is_tool = false %}
            {%- endif %}
            {%- if message['role'] == 'tool' %}
                {%- set prev_ns.is_tool = true %}
                {%- if prev_ns.is_tool_first %}
                    {{- toolresponses_begin_token + '\n' }}
                    {%- set prev_ns.is_tool_first = false %}
                {%- endif %}
                {{- toolresponse_begin_token + '\n' + visible_text(message['content']) + '\n' + toolresponse_end_token + '\n' }}
            {%- endif %}
            {%- if loop.last and message['role'] == 'assistant' %}
                {%- set last_ns.last_is_assistant = true %}
            {%- endif %}

        {%- endfor %}
        {%- if prev_ns.is_tool %}
            {{- toolresponses_end_token }}
        {%- endif %}
        {%- if add_generation_prompt %}
            {%- if not last_ns.last_is_assistant %}
                {%- if reasoning_effort is defined and reasoning_effort in ['low', 'high'] %}
                    {{- assistant_token + think_begin_token }}
                {%- elif reasoning_effort is defined and reasoning_effort == 'no_think' %}
                    {{- assistant_token + think_begin_token + think_end_token }}
                {%- else %}
                    {{- assistant_token }}
                {%- endif %}
            {%- endif %}
        {%- endif %}
      # Never touch the network at launch — weights are prefetched at install.
      - --offline
      - --no-mmap
      - --cont-batching
      - -np
      - "1"
      - -t
      - "16"
      - -tb
      - "16"
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
    networks:
      - spark-ai-hub-net
    environment:
      - GGML_CUDA_ENABLE_UNIFIED_MEMORY=1
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - LLAMA_OFFLINE=1
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

secrets:
  hf_token:
    environment: HF_TOKEN

# Created by the Hub, shared by every app, and never torn down with any
# single one of them -- hence external.
networks:
  spark-ai-hub-net:
    external: true
