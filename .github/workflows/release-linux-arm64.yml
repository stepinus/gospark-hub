name: release linux/arm64

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Cross-compiles: the daemon is pure Go (modernc sqlite, no cgo), so an
    # x86 runner produces the arm64 binary and no arm runner is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The SPA is embedded (frontend/embed.go), so dist/ must exist before
      # `go build` or the binary ships without a UI.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build daemon
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags '-s -w' -o gospark-sahd ./cmd/sahd
          file gospark-sahd
          sha256sum gospark-sahd > gospark-sahd.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: gospark-sahd-linux-arm64
          path: |
            gospark-sahd
            gospark-sahd.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gospark-sahd
            gospark-sahd.sha256
          generate_release_notes: true
