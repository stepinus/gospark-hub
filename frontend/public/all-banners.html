<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Banners</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0D0D1A; color: #F0ECF6; font-family: 'Inter', system-ui, sans-serif; padding: 24px; }
  h1 { font-family: 'Manrope'; font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #6E6C7A; font-size: 13px; margin-bottom: 24px; }
  .banner-label { font-family: monospace; font-size: 12px; color: #6E6C7A; margin: 6px 2px 10px; }

  .hero {
    position: relative; height: clamp(420px, 62vh, 620px); width: 100%;
    overflow: hidden; border-radius: 16px; margin-bottom: 6px;
  }
  .hero img.bg {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .hero .overlay-left {
    position: absolute; inset: 0;
    background: linear-gradient(to right, rgba(13,13,26,0.95) 0%, rgba(13,13,26,0.6) 40%, transparent 70%);
  }
  .hero .overlay-bottom {
    position: absolute; inset-inline: 0; bottom: 0; height: 128px;
    background: linear-gradient(to top, #0D0D1A, transparent);
  }
  .hero .content {
    position: relative; z-index: 2; height: 100%; max-width: 720px;
    display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 40px;
  }
  .hero .top-row { display: flex; align-items: center; gap: 12px; }
  .hero .logo {
    height: 56px; width: 56px; border-radius: 12px; background: rgba(0,0,0,0.35);
    object-fit: contain; padding: 8px; border: 1px solid rgba(255,255,255,0.15);
  }
  .hero .badge {
    border-radius: 999px; background: #76E22A; padding: 2px 10px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: #0A2000;
  }
  .hero h2 {
    font-family: 'Manrope'; font-size: clamp(1.6rem, 3.4vw, 2.6rem); font-weight: 800;
    line-height: 1.15; text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .hero .meta { font-size: 12px; color: #A8A6B2; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  .hero .desc {
    font-size: 14px; color: #A8A6B2; line-height: 1.5; max-width: 560px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .status { padding: 40px; font-size: 14px; color: #6E6C7A; }
</style>
</head>
<body>

<h1>All Top Banners</h1>
<p class="subtitle">Every recipe's hero/backdrop image, rendered at production hero size. Pulled live from /api/recipes.</p>
<div id="root"><div class="status">Loading recipes…</div></div>

<script>
function stem(recipe) {
  const image = recipe && recipe.cover && recipe.cover.image;
  if (!image) return 'generic';
  return image.replace(/\.[^./]+$/, '');
}
function backdropFor(recipe) {
  return '/covers/' + stem(recipe) + '-backdrop.jpg';
}
function formatParams(r) {
  if (r.params_b == null) return null;
  return r.params_b >= 1000 ? (r.params_b / 1000) + 'T' : r.params_b + 'B';
}

fetch('/api/recipes')
  .then((r) => r.json())
  .then((recipes) => {
    recipes.sort((a, b) => a.name.localeCompare(b.name));
    const root = document.getElementById('root');
    root.innerHTML = recipes.map((r) => {
      const meta = [r.author, formatParams(r), r.quantization].filter(Boolean).join('  ·  ');
      return `
        <div class="banner-label">${r.slug}  —  cover: ${(r.cover && r.cover.image) || '(none, generic fallback)'}</div>
        <div class="hero">
          <img class="bg" src="${backdropFor(r)}" alt="" onerror="this.style.opacity=0.15">
          <div class="overlay-left"></div>
          <div class="overlay-bottom"></div>
          <div class="content">
            <div class="top-row">
              ${r.logo ? `<img class="logo" src="${r.logo}" onerror="this.style.display='none'">` : ''}
              <span class="badge">Featured</span>
            </div>
            <h2>${r.name}</h2>
            <div class="meta">${meta}</div>
            <div class="desc">${r.description || ''}</div>
          </div>
        </div>`;
    }).join('');
  })
  .catch((e) => {
    document.getElementById('root').innerHTML = `<div class="status">Failed to load /api/recipes: ${e}</div>`;
  });
</script>

</body>
</html>
